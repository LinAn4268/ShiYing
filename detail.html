"id":10668293,"page":"https://www.pexels.com/photo/close-up-shot-of-black-canon-dslr-camera-on-person-s-hand-10668293/","ph":"Luis Quintero","src":"https://images.pexels.com/photos/10668293/pexels-photo-10668293.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/10668293/pexels-photo-10668293.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/10668293/pexels-photo-10668293.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Close-Up Shot of Black Canon Dslr Camera on Person's Hand"}},{"id":"10-1-2","title":"10.1.2 传感器与镜头清洁状态检查","tag":"提示","section":"10.1 出发前的基本准备","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"照片上同一个位置总有个黑点，擦镜头也没用，怎么都擦不掉？那大概不是镜头的问题，是传感器上落了灰。学会分清镜头脏和传感器脏，才不会擦错地方白费劲，也知道什么时候该交给专业服务。","principle":"传感器上的灰尘不会随对焦移动，它会在每张照片的固定位置留下小黑点，光圈越小越明显；拍天空、白墙这种大片纯色时无处可藏，很容易被误当成镜头脏了，其实两者不是一回事，擦镜头自然白费。\n镜头上的指纹和油污则是另一种表现：它们让光线散射，画面发雾、反差下降，逆光时还可能多出眩光。看起来像没拍清楚，其实问题出在镜片表面，用气吹和镜头布擦镜片才对症。\n出发前用气吹吹掉浮尘，吹口别贴到表面，再用专用镜头布由中心向外轻擦，顺着一个方向别来回蹭；传感器积灰严重就交给专业服务，自己别拿棉签或嘴去碰。日常盖好镜头盖、换镜头时动作快一点，机背朝下减少进灰，比事后清理省事得多。","steps":["用 f/16 小光圈对着白墙拍一张，看有没有固定黑点，有就是传感器落灰；换个画面位置还在，就确认了。","用气吹吹掉镜头和传感器的浮尘，吹口别碰到表面，保持一点距离，免得把灰尘按得更牢。","用专用镜头布由中心向外轻擦镜片，顺着一个方向转，别来回蹭，免得把砂粒压进镀膜。","换镜头时机背朝下、动作要快，不用时随手盖好后盖，减少进灰的机会，这比事后清理管用得多。"],"mistakes":["拿衣角或纸巾擦镜头，纤维和砂粒会把镀膜擦出细痕，越擦越糟；用专用镜头布才稳妥。","对着传感器直接用嘴吹，喷上去的全是唾液，反而更脏；用气吹，别让吹口碰到表面。","灰尘严重还自己拆开清理，弄坏传感器，维修费够你后悔；积灰顽固就交给专业服务。"],"example":"拍雪山时，小王发现每张照片天空的同一位置都有个小黑点，以为是镜头脏了，擦了半天也没用。后来他用 f/16 对着白纸试拍，黑点还在同一个位置，才确认是传感器灰尘，不是镜头的毛病。送店清理后黑点消失，他也明白了：出发前两分钟的检查，能省掉一整晚的修图，还能保住雪山天空的干净，比回家对着电脑一张张补要划算得多。","case":null,"takeaway":"干净的镜片和传感器，是清晰画质最便宜的保障，出发前两分钟检查能省一晚修图。","keywords":["传感器","镜头清洁","气吹","灰尘"],"photo":{"alt":"相机顶部的拨盘与按钮，出发前要逐个确认","id":30399598,"page":"https://www.pexels.com/photo/close-up-of-camera-control-dials-and-buttons-30399598/","ph":"Markus Winkler","src":"https://images.pexels.com/photos/30399598/pexels-photo-30399598.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/30399598/pexels-photo-30399598.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/30399598/pexels-photo-30399598.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Close-up of Camera Control Dials and Buttons"}},{"id":"10-1-3","title":"10.1.3 脚架、滤镜、快门线、闪光灯是否带齐","tag":"实操","section":"10.1 出发前的基本准备","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"到了海边才发现三脚架落在家里，这种遗憾几乎每个新手都有过一次：慢门只能把相机按在栏杆上，糊了一半。一张按题材写的清单，逐项打钩，比“下次一定记得”管用得多。","principle":"清单的核心是按题材配装备，先想清楚这次拍什么，再决定带什么。拍风光要三脚架和中灰镜，慢门水流、星轨都离不开稳定支撑，手持几秒的曝光几乎不可能端稳；拍夜景做长时间曝光，快门线能避免手按快门带来的抖动，没带也可以用延时自拍顶一下。\n拍人像则带上闪光灯和反光板，用于补光与塑造光影，让面部细节在暗光里也立体。人像之外用不上的灯和板，就不必硬塞进包里。\n每件装备还要确认能用，而不只是装进包里：脚架带好云台和快装板，滤镜带对应口径或转接环，闪光灯带足备用电池。出门前对着清单逐项打钩，比凭记忆可靠得多；清单也防带多，一包装不下、每次翻半天找的器材，到了现场只会碍事。","steps":["按题材列清单：风光就是三脚架加 ND8/ND16 中灰镜，一样都不能少，慢门靠它们稳住和压光。","夜景再加快门线，长曝时用 2 秒延时自拍代替，别用手按，按下那一下的抖动足够毁掉一张片子。","人像带闪光灯、反光板，备用电池准备 2 块，闪灯到现场别没电，暗光补光全靠它。","出发前照清单逐件打钩，最后再确认一次快装板，这是最容易忘的一件，没了它脚架架不起来。"],"mistakes":["背了一堆用不上的装备，真要用时又找不到，包乱得像搬家；按题材精简，清单上没写的别带。","滤镜带了，转接环没带，口径对不上，白背一路；出发前把口径和转接环一起核对。","脚架带了却忘快装板，到现场架不起来，只能干着急；打钩时最后专门确认这一件。"],"example":"小李计划去海边拍慢门，出门凭记忆只带了相机和 ND 镜。到了才发现三脚架还在家里，浪一层层漫上礁石，正是慢门的好时候，他只能把相机按在栏杆上凑合，画面糊了一半，只能眼睁睁看着光一点点暗下去。后来他把清单贴在门口，每次出门照单打钩：脚架、ND 镜、快门线、快装板，一样样点过去，再没漏过关键装备，拍起来也从容多了。","case":{"scene":"清晨去海边拍长曝光，天还没亮，浪一层层漫上礁石，正是慢门的好时候，错过这一波光就得等明天。","setup":"按清单打钩：脚架、ND 镜、快门线、快装板，装包后在门口再点一遍，一样样确认能用。","why":"慢门要靠脚架稳住机身，机位晃一点，几秒的曝光就全糊了；ND 镜压住海水的高光，才能把曝光延长到浪化成雾，快门线免去手按快门的抖动。少带一件，慢门就只能靠运气，白起这么早也留不下丝滑的水。","note":"清单贴在门后，出门照着念一遍，别凭记忆。"},"takeaway":"一张清单，胜过十次“下次一定记得”，出门照着打钩最省心。","keywords":["装备清单","三脚架","快门线","滤镜"],"photo":{"alt":"摄影包与三脚架捆在一起，装备带齐再出门","id":41045418,"page":"https://www.pexels.com/photo/sleek-black-camera-backpack-with-tripod-41045418/","ph":"Stephen Leonardi","src":"https://images.pexels.com/photos/41045418/pexels-photo-41045418.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/41045418/pexels-photo-41045418.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/41045418/pexels-photo-41045418.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Sleek Black Camera Backpack with Tripod"}},{"id":"10-2-1","title":"10.2.1 RAW还是JPEG，色彩空间怎么选","tag":"实操","section":"10.2 相机参数的按场景预设","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"同样一张照片，存成 RAW 还是 JPEG，发朋友圈用 sRGB 还是 Adobe RGB，结果差得比想象中多：一个暗部能拉回来，一个发出去就发灰。这些该在按快门前就定好，省得后期返工，也省得卡在半路空间不够。","principle":"RAW 记录的是传感器最原始的数据，后期调整曝光和白平衡的余地很大，拍偏一点还有救回来的可能，缺点是文件更大，占卡也占电脑空间；JPEG 是相机处理好的成品，体积小、拷出来就能分享，但可调整的空间有限，调过头就露出马赛克。\n很多相机支持同时记录两者，重要场景用 RAW＋JPEG 双存，兼顾效率与余地：JPEG 随手分享，RAW 留着练后期。心里先分清哪张是当天要发的、哪张值得留下慢慢调。\n色彩空间方面，日常网络和手机浏览用 sRGB 最稳，颜色不会在别人的屏幕上失真；只有专业印刷或深度后期流程才考虑 Adobe RGB，直接发到网上反而发灰。先想清楚照片用在哪里，再选格式，就不会纠结。","steps":["重要题材设 RAW＋JPEG 双格式，普通记录用 JPEG 精细档，按用途分，别一律拍 RAW 占空间。","网络分享选 sRGB，印刷流程再考虑 Adobe RGB，别用错地方，颜色才不会在别人的屏幕上失真。","确认卡里空间够 RAW 的体积，单张大约 20–30MB，别拍一半卡满，重要场景开双卡更稳。","导出前再核对一次色彩空间，别中途换过忘了，颜色才不偏，发出去也不用返工。"],"mistakes":["全程 RAW 却从不后期，白占一倍空间，还给自己添麻烦；不打算调就设 JPEG 精细档或双格式。","用 Adobe RGB 直出发朋友圈，颜色发灰，别人看着像没拍好；网络分享认准 sRGB 就不会偏。","JPEG 选了最低画质，一放大全是马赛克，想留底都晚了；重要场景至少用精细档。"],"example":"小张第一次拍人像，听说 RAW 专业，就全程拍 RAW，结果回家却不会处理，照片发到网上还是相机默认的样子，卡里空间还占了双倍。后来他改成 RAW＋JPEG：JPEG 走 sRGB，拍完直接发朋友圈；RAW 另存着，等有空慢慢练后期，暗光拍坏的那几张还能救回来。既省事又不浪费素材，相机里也不用再为格式纠结。","case":{"scene":"朋友的生日聚会，室内灯光偏暗，当晚要发朋友圈又要留底，两头都要顾，暗光还怕拍坏。","setup":"机内设为 RAW＋JPEG，JPEG 走 sRGB 直出，RAW 另存一张卡，各司其职，拍前先确认卡里空间够。","why":"JPEG 体积小、按 sRGB 显示，当晚就能发；RAW 保留宽容度与白平衡余地，暗光拍坏了回去还能救，不浪费这次机会。","note":"先想好照片去哪，再定格式，别等回家再纠结。"},"takeaway":"格式服务用途：要后期选 RAW，要速度选 JPEG，分享用 sRGB，先想用途再定格式。","keywords":["RAW","JPEG","sRGB","色彩空间"],"photo":{"alt":"手指正在拨动相机背屏上的参数","id":30849948,"page":"https://www.pexels.com/photo/close-up-of-person-adjusting-camera-settings-30849948/","ph":"Esmerald Heqimaj","src":"https://images.pexels.com/photos/30849948/pexels-photo-30849948.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/30849948/pexels-photo-30849948.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/30849948/pexels-photo-30849948.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Close-Up of Person Adjusting Camera Settings"}},{"id":"10-2-2","title":"10.2.2 曝光模式、光圈、快门、ISO的预置思路","tag":"理论","section":"10.2 相机参数的按场景预设","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"光线一变就手忙脚乱，多半是因为出门前没想好用什么模式：从亮处走到暗处，光圈快门都来不及调。预设不是死规矩，它只是让你站上起跑线，先有个稳的起点，再按现场的光微调。","principle":"风光追求前后都清晰，用光圈优先并设 f/8–f/11，配合三脚架把 ISO 降到 100，换取干净的画质；运动要凝固动作，用快门优先并设 1/500 秒以上，速度不够，奔跑的人就拖成影子。先分清要的是景深还是速度，再选模式，别拿一个档走天下。\n经验丰富的拍摄者会用手动模式，把光圈、快门、ISO 一次定好，光线稳定时最省心，不用相机跟着环境来回变。\nISO 尽量自动并设上限，比如 ISO 3200，让相机在明暗变化中自己平衡，既保住快门速度，又不让噪点失控；从室内走到室外，它会自动收回来。预设不是死规矩，现场还要结合直方图微调，才应付得了随时在变的光。","steps":["风光：光圈优先 f/8，ISO 100，把三脚架支起来，慢门也不怕，前后都清楚。","运动：快门优先 1/1000 秒，同时打开连续对焦，动作才凝固得住，主体一动焦点也跟得上。","日常：自动 ISO，把上限设在 3200 附近，别让噪点失控，明暗变化时相机自己平衡。","光线稳定时切到手动 M 档，把曝光参数锁住，一次定好不再操心；换场景再看直方图微调。"],"mistakes":["全程自动档，一遇逆光就不知道从哪下手，相机也拿不准你的意图；先按题材选好模式再拍。","ISO 死锁在 100，夜景拍出来全是糊的，快门慢到端不住；改用自动 ISO 并设上限更省心。","预设完就不看直方图，过曝了也不知道，回家才发现白一片；每换一次光线就回放确认一次。"],"example":"拍一场少儿足球赛，老陈提前把相机设成快门优先 1/1000 秒、自动 ISO 上限 3200、连续对焦加连拍。整场他只管构图和按快门，孩子们奔跑的瞬间张张清楚，顶多看一眼直方图确认没过曝。旁边用自动档的家长，照片里全是模糊的小腿，就是因为没预设——相机会优先保证亮，却不知道你要的是凝固动作。","case":null,"takeaway":"预设让你赢在起跑线，现场微调才走得远，两者缺一不可。","keywords":["曝光模式","光圈优先","快门优先","ISO"],"photo":{"alt":"手持相机，机顶的模式盘就在拇指下","id":13939626,"page":"https://www.pexels.com/photo/black-dslr-camera-on-person-s-hand-13939626/","ph":"Pok Rie","src":"https://images.pexels.com/photos/13939626/pexels-photo-13939626.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/13939626/pexels-photo-13939626.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/13939626/pexels-photo-13939626.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Black Dslr Camera on Person's Hand"}},{"id":"10-2-3","title":"10.2.3 白平衡、照片风格、降噪设置的预置","tag":"实操","section":"10.2 相机参数的按场景预设","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"白平衡偏一点，整组照片的底色就偏了，后期一张张校色很费劲。这三项设置花一分钟就能定好，却能省下现场反复钻菜单的时间，把注意力留给构图和时机。","principle":"光线复杂、变化快时用自动白平衡最省心；需要准确还原颜色时手动设色温：钨丝灯约 3200K，阴天约 6500K。相机上的色温值调得越低，画面越偏冷，调得越高越偏暖，别记反；设错了整组肤色就会偏蓝或偏黄。\n照片风格按题材选：人像用柔和，肤色更通透；风景用鲜艳，天空更蓝、草木更绿。风格选错，比如误设成黑白，回家才发现就晚了。\n高 ISO 会带噪点，开启降噪能减轻颗粒，但过强会连头发丝、纹理这些细节一起抹掉，一般选标准档就够。把这些在出发前设好、存成自定义档，现场一键切换，不用临时翻菜单，也保住了整组色调的统一。","steps":["日常用自动白平衡 AWB，特殊光线下手动设 3200K 或 6500K，别一直停在某一档。","人像选柔和风格，风光选鲜艳或标准风格，按题材挑，换场景前先确认一遍别选错。","ISO 超过 1600 时开启标准降噪，别直接上最高档，细节会糊，头发和纹理尤其明显。","在菜单里存成自定义档，需要时一键切过去，现场不钻菜单，几秒就能回到拍摄状态。"],"mistakes":["白平衡一直停在钨丝灯档，白天拍出来一片蓝，整组都偏；光线变了记得重设或回到自动。","降噪开到最高，人物的头发糊成一团，细节全抹平；标准档通常够用，别一味求干净。","风格被选成黑白却没察觉，回家才发现，彩色的再也找不回；拍前扫一眼风格设置。"],"example":"小周在暖黄的餐厅拍人像，自动白平衡把脸拍得发黄，怎么调姿势都不对。他先拍了一张试片，把色温手动调到约 3800K，肤色立刻回来了，再配合柔和风格，皮肤干净通透。这些他出门前就存好了备用档，现场切换只用几秒，没打断拍摄节奏，也不用回家对着电脑一张张校色。","case":{"scene":"晚上在暖黄灯光的餐厅给朋友拍人像，桌上烛光也在晃，光线暖得发黄，肤色很容易跟着偏。","setup":"进店先拍一张试片，色温手调到 3800K 左右，照片风格选人像、降噪开标准，存成备用档。","why":"自动白平衡会把暖黄灯光校成灰白再反弹，脸就发黄，烛光一晃还会忽黄忽白；手动锁定偏低色温肤色才正，预置降噪让高感也不至于糊成一片，整组色调才统一。","note":"存进自定义档，现场两秒切过去，别现找菜单。"},"takeaway":"把底色设对，后期少走一半弯路，也保住了整组照片色调的统一。","keywords":["白平衡","色温","照片风格","降噪"],"photo":{"alt":"复古机身的拨盘刻度，用来预设白平衡与照片风格","id":32203082,"page":"https://www.pexels.com/photo/close-up-of-a-retro-style-fujifilm-camera-32203082/","ph":"Irfan Simsar","src":"https://images.pexels.com/photos/32203082/pexels-photo-32203082.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/32203082/pexels-photo-32203082.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/32203082/pexels-photo-32203082.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Close-up of a Retro-Style Fujifilm Camera"}},{"id":"10-2-4","title":"10.2.4 对焦模式、驱动模式、测光模式的预置","tag":"实操","section":"10.2 相机参数的按场景预设","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"对焦、驱动、测光，这三项最该在出门前按题材设好：拍静止的人和拍奔跑的孩子，用的是完全不同的两套设置。关键时刻少切一次菜单，就可能多留住一个瞬间，决定性瞬间不等人。","principle":"静止题材用单次自动对焦，半按快门对焦后锁定，再移动构图也不跑焦；运动题材用连续自动对焦，相机会持续追着主体，适合奔跑的孩子和运动员，主体一动焦点也跟着走。\n驱动模式上，抓拍用连拍，每秒 5–10 张，表情总有到位的一张；摆拍和静物用单张，省卡也省筛选时间。连拍一直开着，卡很快满，挑片也累。\n光线均匀时用评价测光，图个省事；画面明暗反差大、主体逆光时用点测光，并对主体测光，别让亮背景把脸压黑。把这三项按题材预设好、存进自定义档，举起相机就能拍，决定性瞬间少做很多切换。","steps":["静物人像：单次对焦 AF-S，配单张拍摄，对好焦再构图，焦点锁住后移动也不跑。","运动抓拍：连续对焦 AF-C，连拍 8 张/秒，别让主体跑出焦点，总有一张表情到位。","逆光人像：点测光对准面部测光，然后锁定，别让背景把脸压黑，回放时看脸色确认。","存成 C1/C2 自定义档，换场景一键切换，瞬间来了不翻菜单，少一次切换多一个瞬间。"],"mistakes":["拍运动还用单次对焦，张张都脱焦，主体一动焦点就丢；换成连续对焦才有得救。","连拍一直开着，卡一会儿就满了，摆拍也咔咔按一堆；按题材切回单张，省卡也省筛选。","逆光用评价测光，人脸黑成一团，背景再清楚也没用；点测对准脸，先保住主体。"],"example":"拍孩子生日吹蜡烛，小陈提前设好连续对焦和连拍，测光对准脸。从吹气到烛火摇晃，一口气拍了十几张，挑出表情最生动、眼睛睁着的那张。他姐夫用单次对焦加单张，按下快门时孩子已经闭眼，好瞬间全错过了——不是相机不行，是三项设置没按题材来。","case":{"scene":"孩子两岁生日，客厅关了灯，只留蛋糕上几支蜡烛，光线又暖又暗，小脸被烛光照亮，四周几乎全黑，正是最想留住的一刻。","setup":"提前切到连续对焦加连拍，测光用点测对准脸，半按快门一路跟住孩子的动作，感光度先抬上去并存好档，别等烛火晃起来才翻菜单。","why":"吹蜡烛只有一两秒，单次对焦加单张常在孩子闭眼时按下快门；连续对焦持续跟焦、连拍多留几张，才挑得出睁眼的瞬间。屋里光暗，感光度不先抬上去，快门慢下来，这几张也会糊成一团。","note":"烛光暗，提前把感光度抬上去存好档，别等吹蜡烛时才现调。"},"takeaway":"三项预设到位，瞬间来了才接得住，关键时刻不用翻菜单。","keywords":["对焦模式","连拍","测光","预设"],"photo":{"alt":"木桌上的复古微单，按键布局决定了参数怎么预置","id":38719534,"page":"https://www.pexels.com/photo/vintage-style-mirrorless-camera-on-wooden-table-38719534/","ph":"Soc Nang Dong","src":"https://images.pexels.com/photos/38719534/pexels-photo-38719534.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/38719534/pexels-photo-38719534.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/38719534/pexels-photo-38719534.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Vintage Style Mirrorless Camera on Wooden Table"}},{"id":"10-3-1","title":"10.3.1 试拍、回放、看直方图的习惯","tag":"实操","section":"10.3 现场拍摄中的判断","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"屏幕上的雪白得好看，回家一看全是一片死白，纹理一点不剩。这种落差，试拍一张、看一眼直方图就能避免——屏幕亮度会骗你，直方图和放大回放不会。","principle":"试拍是现场的校准：先按预想参数拍一张，回放时放大到 100%，检查对焦是不是落在主体上、细节有没有糊，屏幕小、缩略图看不真切，放大才作数。\n再看直方图。它是亮度分布的图表：波形贴住右边缘，说明高光溢出，天空或雪面会是一片死白；贴住左边缘，说明暗部被淹没，黑处的细节丢了。这两种溢出后期都拉不回来，得在现场解决。\n发现偏差就调曝光补偿或光圈快门，再拍一张确认，直到波形退回边界以内。养成拍、看、调的循环，每换一次光线或机位就重复一次。几十秒的投入，能换回一整组能用的片子，比回家对着废片后悔划算得多。","steps":["到新场景先试拍 1 张，回放放大到 100% 看焦点，别只看缩略图，缩略图最容易骗人。","打开直方图，确认波形没有贴住左右边缘，贴了就说明溢出，右缘高光、左缘暗部。","高光溢出就减 1 档曝光补偿，拍一张再看，直到波形退回来，雪的纹理才留得住。","每换一次光线或机位，把这个循环重走一遍，别偷懒，几十秒就能换回整组片子。"],"mistakes":["只看屏幕亮度，大太阳底下的判断全是错的，屏幕会骗你；看直方图才靠谱。","从不放大检查，回家才发现张张都糊，当场就能改的事拖成了废片；回放放大确认焦点。","直方图贴边了还继续拍，高光救不回来，后期也拉不回；先减曝光补偿再往下拍。"],"example":"小吴在雪地拍人像，屏幕里雪白得漂亮，回家才发现雪面全是死白，纹理一点没有。后来他学会看直方图，发现波形贴住右边缘，当场减了 1.5 档曝光补偿，再拍一张，雪的纹理立刻回来了。现在每到一个新场景，他第一件事就是试拍加看直方图，每换一次机位也重来一遍，整组照片再没出过溢出的毛病。","case":{"scene":"雪后初晴的公园，白茫茫一片，朋友穿深色外套站在雪里，反光很强，屏幕看着一片白。","setup":"先试拍一张回放，按直方图把曝光补偿减掉一档到一档半，再拍一张确认，看波形有没有退回。","why":"测光会被大片白雪骗到欠曝，屏幕又偏亮容易误判；直方图波形贴住右缘说明高光已溢出，这里的白已经压成一片、后期拉不回，减补偿才留得住雪的层次。","note":"换个场景先试拍，再看直方图，别信屏幕亮度。"},"takeaway":"拍、看、调循环，是现场最便宜的保险，几十秒换回整组片子。","keywords":["试拍","回放","直方图","曝光补偿"],"photo":{"alt":"摄影师在户外微调相机，边拍边回看","id":36148198,"page":"https://www.pexels.com/photo/photographer-adjusting-camera-outdoors-in-nature-36148198/","ph":"Elvin Muradzade","src":"https://images.pexels.com/photos/36148198/pexels-photo-36148198.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/36148198/pexels-photo-36148198.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/36148198/pexels-photo-36148198.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Photographer Adjusting Camera Outdoors in Nature"}},{"id":"10-3-2","title":"10.3.2 光线方向和色温的再次确认","tag":"提示","section":"10.3 现场拍摄中的判断","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"出发前想好的光，到了现场常常已经变了：太阳移到另一侧，色温转冷，影子拉长，还是那机位，味道却完全不同。隔一会儿抬头看看，画面才不跑偏，别守着出门前的设想一路拍下去。","principle":"光线是拍摄中最活跃的变量：上午的侧光到中午变成顶光，阴影从短变长，人物眼里的光也随之改变。机位没动，效果却大不一样，所以不能把出门前看到的当现场的依据。\n色温也随时间和天气漂移：清晨和黄昏偏暖，约 3000–4000K；阴天偏冷，约 6500K 以上。同样的白平衡设置，拍出来的颜色就是不一样，拍到后面整组容易前后不一。\n所以到场后要重新确认光的方向和冷暖，必要时调整机位避开顶光、转身利用侧光，或者重设白平衡。每隔半小时复查一次，逆光拍人再用反光板补一点，画面才会一直贴着你的意图，而不是拍着拍着就跑偏。","steps":["到场先看太阳在哪边，判断是顺光、侧光还是逆光，再决定站位，别急着按快门。","用灰卡或白纸校准一次白平衡，记下当时的色温，别靠猜，光变了再校一次。","每隔 30 分钟抬头看看，顶光了就挪到阴影里或改侧光，别硬拍，眼下两块黑影很难修。","逆光拍人用反光板补光，或改用点测光对面部测光，别让人脸黑成一团。"],"mistakes":["到场不重新看光，还按出门前的设想拍，结果光早变了，整组片和想的不一样。","正午顶光硬拍人像，眼下两块黑影，后期也难修；挪到阴影里或换个侧光站位就好很多。","从清晨拍到黄昏不改白平衡，前后色调不一，整组像两个场景；隔半小时校一次最稳。"],"example":"小林上午在一面红墙前拍人像，侧光把轮廓勾得很立体，皮肤也通透。她一下午没挪地方，到傍晚太阳绕到背后，光又平又暗，白平衡也没重设，肤色偏青，和上午那批完全接不上。要是每隔一会儿抬头看看光、换个机位、重校一次白平衡，这组照片会整齐得多——好看的光不是一直在原地等你。","case":null,"takeaway":"光线会变，你的判断也要跟着变，隔半小时抬头看看、校一次白平衡。","keywords":["光线方向","色温","白平衡","侧光"],"photo":{"alt":"三脚架上的相机对着日落，光线方向需要再确认","id":21338020,"page":"https://www.pexels.com/photo/man-with-a-camera-on-a-tripod-filming-the-sunset-21338020/","ph":"Amar Preciado","src":"https://images.pexels.com/photos/21338020/pexels-photo-21338020.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/21338020/pexels-photo-21338020.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/21338020/pexels-photo-21338020.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Man with a Camera on a Tripod Filming the Sunset"}},{"id":"10-3-3","title":"10.3.3 主体、对焦点和构图的快速校验","tag":"实操","section":"10.3 现场拍摄中的判断","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"很多问题回家才发现：主体被挡了一半、焦点落在背景上、角落杵着一根树枝。其实按快门前停三秒，按固定顺序扫一遍就能看出来，养成习惯就不用返工了。","principle":"快速校验的顺序是先看主体：它是不是一眼就能被认出来，有没有被前景挡住，位置够不够主要。人眼天生盯着主体，这一眼反而容易漏掉边上的东西。\n再看对焦点：人像要对在眼睛上，静物对在主体上，确认合焦提示真的亮了；最后扫一遍画面四边，看有没有多余的元素抢注意力，灯杆、树杈最容易从头上长出来。\n三秒钟的停顿，能把大量废片挡在存储卡之外。养成这个习惯以后，你会发现挑片时的惊喜变多，返工变少，按快门也更有底气——同样一个公园，成片率能差出一大截。","steps":["第一眼看主体：位置够不够主要，有没有被挡住，认不认得出来，别拍完才发现主角藏起来了。","第二眼看对焦：人像对眼睛，确认合焦提示亮起，别对到背景，眼睛一虚整张就废。","第三眼扫四边：路人、树枝、垃圾桶都清出去，别留杂边，挪半步往往就好了。","拿不准就先拍一张，回放放大再确认一遍，确认了再连拍，别一口气按一堆废片。"],"mistakes":["只顾着看主体，背景里的杂物全没注意，回家才发现碍眼；扫四边只需要两秒。","对焦点落在前景，人物的眼睛是虚的，整张都废；回放放大看眼睛，锐不锐一验便知。","边走边拍从不停顿，张张构图都差不多，没有一个抓人的；停下来按三秒顺序看一遍。"],"example":"小郑在公园拍女朋友，回家翻照片才发现好几张背后都杵着一根路灯杆，像从头顶长出来，只好删掉。后来他养成了三秒校验的习惯：先看对焦在不在眼睛，再扫一遍背景有没有杆状物，有就挪半步。同样一个公园，成片率提高了一半，挑片也轻松多了——差别不在器材，就在按快门前那三秒。","case":{"scene":"周末公园拍女朋友，草地上人多，背后立着路灯和几棵树，稍不留神就穿帮。","setup":"按快门前三秒：先确认对焦点落在眼睛，再扫一遍背后有没有杆状物，有就挪半步再拍。","why":"人眼先看主体，背景的灯杆树杈容易被忽略，回放才发现像从头上长出来，删都来不及；固定顺序校验，把杂物挡在按下快门之前，废片少了，挑片也轻松了。","note":"对焦在眼，背景要干净，别急着按。"},"takeaway":"快门前的三秒钟，省下回家后的三小时，把废片挡在存储卡之外。","keywords":["主体","对焦点","构图","背景"],"photo":{"alt":"摄影师守在河边的三脚架旁，等主体与构图同时到位","id":21085240,"page":"https://www.pexels.com/photo/photographer-sitting-by-camera-on-tripod-on-bank-of-river-in-taipei-21085240/","ph":"Alan Wang","src":"https://images.pexels.com/photos/21085240/pexels-photo-21085240.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/21085240/pexels-photo-21085240.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/21085240/pexels-photo-21085240.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Photographer Sitting by Camera on Tripod on Bank of River in Taipei"}},{"id":"10-3-4","title":"10.3.4 不可逆场景的应急参数预案","tag":"提示","section":"10.3 现场拍摄中的判断","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"烟花升空、孩子破涕为笑，这种时候根本来不及调参数，等你调好，瞬间早过去了。提前留一套应急档，拨过去就能拍，先抓住再说，完美留给回头挑片时追求。","principle":"不可逆场景的特点是没有第二次机会。与其临时手忙脚乱，不如提前预设一套随时能用的参数：较快的快门，比如 1/250 秒以上凝固动作，手抖和主体动都不怕；自动 ISO 应对光线突变，从暗到亮不用你操心。\n再配合连拍和连续对焦，确保抓住瞬间——表情只在一两秒里，连拍多留几张，总有一张睁着眼。可以把这套设置存到相机的自定义档，比如 C2，需要时一个动作就切过去，不必现翻菜单。\n烟花、体育冲刺、孩子的表情都属于这类场景。原则只有一条：先保证拍到，再追求拍好。一个清晰的瞬间，永远胜过完美却错过的参数。","steps":["预设 C2 档：快门优先 1/250 秒，打开自动 ISO，光突变也不怕，拨过去就是一套能用的参数。","驱动设连拍 8–10 张/秒，对焦设连续 AF-C，一张不够多来几张，总有一张表情到位。","拍烟花用手动对焦，提前对好远处，别现场找焦点，烟花不等人，对好就锁住。","场景一来直接拨到 C2，先拍，构图回头再想，别错过，应急档就是关键时刻的安全网。"],"mistakes":["看到烟花才开始调参数，精彩早过去了，调好烟花已落；先把应急档存好，一键切过去。","应急档快门太慢，动作全糊成影子，抓了等于没抓；快门提到 1/250 秒以上才稳。","只按一张，不给连拍留机会，闭眼的那张就错过了；连拍多留几张再挑。"],"example":"跨年时小何想拍烟花，第一朵升空才手忙脚乱调光圈，等调好，烟花已经落了，只剩一截图。第二年他把快门 1/250 秒、自动 ISO、连拍和手动对焦预先存进 C2，提前对好远处。烟花一升空就拨过去连拍，十张里挑出最灿烂的那一张——准备只花了几分钟，抓住的却是一整年的期待。","case":null,"takeaway":"先抓住瞬间，再追求完美，应急档就是你的安全网，关键时刻救场。","keywords":["应急档","连拍","自动ISO","连续对焦"],"photo":{"alt":"田野里的摄影师，遇到不可逆场景要提前想好预案","id":17913191,"page":"https://www.pexels.com/photo/photographer-with-camera-on-tripod-on-field-17913191/","ph":"Elif","src":"https://images.pexels.com/photos/17913191/pexels-photo-17913191.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/17913191/pexels-photo-17913191.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/17913191/pexels-photo-17913191.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Photographer with Camera on Tripod on Field"}},{"id":"10-4-1","title":"10.4.1 记录参数、光线和机位的习惯","tag":"实操","section":"10.4 拍完之后的简单复盘","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"当时觉得肯定记得住，一周后连光圈都记不清了，对着照片只能猜。花一分钟记几个关键词，下次就能站在同一条起跑线上，不用再从零试——记性靠不住，笔记才靠得住。","principle":"记忆很不可靠。用手机备忘录记几个关键词就够：地点、时间、光圈快门 ISO、光线方向、你站的位置。不必写工整，趁热记最准，隔一夜细节就模糊了。\n比如傍晚窗边人像、50mm f/2、ISO 400、侧光、离窗一米——下次遇到类似场景，翻出这条笔记，就能快速还原当时成功的设置。光位往往比参数还关键，所以方向、距离一定要记。\n记录不必工整，关键是坚持。几个月下来，你会有一个可查、可复用的经验库，而不是每次都从零试错。这一分钟的回报，远比想象中大：同样靠窗的位置，别人还在调，你已经按上次的参数开拍了。","steps":["每拍完一个场景，用备忘录记下 5 个关键词，趁热记最准，别等回家全忘了。","写清地点、时间，以及光圈、快门、ISO 三个参数，缺一不可，数字最不容易记。","标注光线方向和机位，比如侧光、离窗一米，光位比参数还关键。","每周花五分钟整理一次，按场景归好类，找起来才快，攒久了就是自己的经验库。"],"mistakes":["全靠脑子记，下次遇到同一个场景又从零试，白交学费；几个关键词就够，别偷这一分钟。","记录写得太繁琐，坚持两天就放弃了，几个关键词才留得住，越简单越能长久。","只记参数不记光线，换个场景就对不上，光位才是关键，方向和距离一起写。"],"example":"小唐在咖啡馆窗边拍过一次人像，效果特别满意，当时顺手记下 50mm、f/2、ISO 400、下午侧光、离窗一米。半年后又在类似环境拍，他翻出笔记照着设，五分钟就进入状态，成片一样通透。他说那几个词比任何教程都管用，因为写的时候，光和位置都是他自己的。","case":{"scene":"咖啡馆靠窗的位置，下午侧光落在桌面上，给朋友拍了一组，效果特别满意，光和位置都想留住。","setup":"拍完在手机备忘录记下焦距、光圈、ISO、光源方向和离窗距离，趁热写清楚，别隔夜。","why":"同样的窗光换个日子很难复现，太阳的角度、窗帘的开合都变了，光的味道就不一样；参数与机位一旦记下，下次遇到相似环境就能直接照搬，省掉反复试错的时间。","note":"一条记录，抵十张乱拍，别只靠记性。"},"takeaway":"一分钟记录，换来下次的快速复用，别信自己的记性。","keywords":["拍摄记录","参数","机位","备忘录"],"photo":{"alt":"回看相机里的照片，对照参数与光线找原因","id":15558425,"page":"https://www.pexels.com/photo/man-checking-photos-on-camera-15558425/","ph":"Kawe Rodrigues","src":"https://images.pexels.com/photos/15558425/pexels-photo-15558425.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/15558425/pexels-photo-15558425.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/15558425/pexels-photo-15558425.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Man Checking Photos on Camera"}},{"id":"10-4-2","title":"10.4.2 从废片中反推前期问题","tag":"提示","section":"10.4 拍完之后的简单复盘","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"糊片、过曝、背景杂乱——每张废片其实都在告诉你，哪一步没做到位：快门太慢、补偿忘了、取景时没扫背景。删掉很容易，读懂它才有用，废片是最好的老师。","principle":"与其删掉了事，不如花几秒问问它为什么废。主体模糊，多半是快门低于安全快门，或者对焦没跟上；高光一片死白，是曝光补偿没减，或者测光点选错了。不同症状指向不同环节，先分好类再下药。\n背景杂乱，是取景时没扫四边。把原因归到拍摄前或拍摄中的某个具体环节，改进才有方向，否则“下次注意”只会重复同样的错误。\n可以在笔记里写：糊片＝快门 1/30 太慢，下次不低于 1/125，不够就开大光圈或提 ISO。让教训变成一条能执行的规则，废片分析得越具体，下一次的进步就越实在；写不出动作，等于白分析。","steps":["把废片按原因分成三类：模糊、曝光、构图，先归类再看，别一堆混着翻。","模糊的，回去核对当时的快门是否低于 1/125 秒，找具体数字，别只写“太慢”。","过曝的，检查是不是忘了减曝光补偿，或测光点选错，回放时看直方图确认。","在笔记里写下一条下次能直接执行的改进规则，别只写“要拍好”，要有具体动作。"],"mistakes":["废片直接删掉，从来不去想为什么废，下次照犯；先归因再删，几秒钟的事。","把所有问题都推给运气不好，就永远学不到东西；每张都能找到具体环节。","只写“要拍好”，没有具体能改的动作，等于白写；写成“手持不低于 1/125 秒”才有用。"],"example":"小赵有一组室内照片全拍糊了。他没删，翻出参数一看，快门只有 1/30 秒，远低于安全快门，手一抖就全废了。他把规则写成：室内手持不低于 1/125 秒，不够就开大光圈或提高 ISO。下次拍同样场景，张张清楚，废片就这样变成了经验——丢掉的是几张照片，留下的是一条下次能用的规则。","case":null,"takeaway":"给每张废片找到原因，把教训写成能执行的规则，进步才有方向。","keywords":["废片复盘","快门速度","曝光","归因"],"photo":{"alt":"在机背屏幕上逐张回看，从废片反推前期问题","id":9909082,"page":"https://www.pexels.com/photo/a-woman-looking-at-the-photos-on-the-dslr-camera-9909082/","ph":"Ron Lach","src":"https://images.pexels.com/photos/9909082/pexels-photo-9909082.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/9909082/pexels-photo-9909082.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/9909082/pexels-photo-9909082.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"A Woman Looking at the Photos on the DSLR Camera"}},{"id":"10-4-3","title":"10.4.3 建立自己的场景—参数对照经验","tag":"提示","section":"10.4 拍完之后的简单复盘","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"拍得久了，你会慢慢知道什么场景该用什么设置：窗边人像、傍晚海边、夜景街头，各有各的稳妥起点。把它整理成一张表，下次就不用从零开始试，直接站在起跑线上。","principle":"把反复验证过的成功设置整理成对照表：室内窗边人像用 50mm f/2、ISO 400；傍晚风光用 f/8、ISO 100 加三脚架；夜景手持用 35mm f/1.8、快门 1/60 秒、ISO 1600。每项都留着当时验证过的数字，遇到相似场景直接照搬。\n每项都来自你自己的实拍，比任何通用教程都更贴合你的器材和手感；同一套参数换个人、换支镜头就未必合适，所以表要写自己的数据。\n遇到新场景时，先从表里挑一个最接近的起点，再按现场光线微调，比从零试错快得多。表里还要标清适用条件，比如有窗、下午三点的侧光，条件对了才照搬。经验加复盘，是进步最快的方式；把别人的经验变成自己的，才算真正掌握。","steps":["按场景建表：室内人像、傍晚风光、夜景手持各占一格，先建框架，别一上来求全。","每格填进验证过的光圈、快门、ISO 和焦距，写自己的数据，别照抄别人的。","标注适用条件，比如有窗、下午三点的侧光，条件对了才照搬，光线变了就微调。","每次实拍后更新，把更好的设置替换进去，表要跟着变，别让它一成不变捆住自己。"],"mistakes":["直接照搬别人的参数，忘了器材本来就不一样，未必适合你；先按自己的实拍验证再写进表。","经验表一成不变，光线变了也懒得调，反而被表捆住；把它当初稿，现场还要试拍微调。","只记成功案例，失败的教训一条不留，弯路还得重走；废片反推出的规则也该进表。"],"example":"小孙把两年的拍摄整理成一张对照表：阴天公园人像用 85mm f/2.8、ISO 200，傍晚海边用 f/11、1/30 秒加脚架。每次接到类似的拍摄，他先看表定起点，再花两分钟试拍微调，很快进入状态。这套自己的经验，比任何教程都顺手——因为每一行背后，都是他自己拍过、改过、验证过的。","case":null,"takeaway":"把经验变成一张表，下次直接站在起跑线上，别从零试。","keywords":["场景参数表","复盘","经验积累","起跑线"],"photo":{"alt":"把相机屏幕转给同伴看，复盘这张为什么成","id":36776811,"page":"https://www.pexels.com/photo/photographer-shows-camera-display-to-friends-in-hanoi-36776811/","ph":"Hong Quang Official","src":"https://images.pexels.com/photos/36776811/pexels-photo-36776811.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/36776811/pexels-photo-36776811.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/36776811/pexels-photo-36776811.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Photographer Shows Camera Display to Friends in Hanoi"}}];

      return rgb2hex(p[0], p[1], p[2]);
    }
    var s = v.match(/color\(srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/);
    if (s) return rgb2hex(parseFloat(s[1]) * 255, parseFloat(s[2]) * 255, parseFloat(s[3]) * 255);
    return '#808080';
  }
  function cssv(name) {
    return toHex(getComputedStyle(root).getPropertyValue(name));
  }
  function onFor(hex) {
    if (cr('#ffffff', hex) >= 4.5) return '#ffffff';
    if (cr('#111111', hex) >= 4.5) return '#111111';
    return '#000000';
  }
  /* 在 HSL 明度上找最近的、四类背景都 ≥4.5 的取值 */
  function solve(h, s, l0, bgs) {
    var d, i, cands, c;
    for (d = 0; d <= 0.5; d += 0.01) {
      cands = [l0 - d, l0 + d];
      for (i = 0; i < 2; i++) {
        if (cands[i] < 0.02 || cands[i] > 0.98) continue;
        c = hsl2hex(h, s, cands[i]);
        if (okAccent(c, bgs)) return c;
      }
    }
    return null;
  }
  function okAccent(c, bgs) {
    var i;
    for (i = 0; i < bgs.length; i++) { if (cr(c, bgs[i]) < 4.5) return false; }
    if (cr(onFor(c), c) < 4.5) return false;
    if (cr(c, mix(c, bgs[0], 0.16)) < 4.5) return false;
    return true;
  }

  function applyAccent() {
    var props = ['--accent', '--accent-2', '--accent-soft', '--on-accent'];
    if (!state.accent) {
      props.forEach(function (p) { root.style.removeProperty(p); });
      return;
    }
    var bg = cssv('--bg'), bgs = [bg, cssv('--panel'), cssv('--panel-2')];
    var hsl = rgb2hsl(hex2rgb(state.accent));
    var acc = solve(hsl[0], hsl[1], hsl[2], bgs) || state.accent;
    var soft = mix(acc, bg, 0.16);
    var dir = lum(acc) > lum(bg) ? 0.1 : -0.1;
    var a2 = solve(hsl[0], hsl[1], Math.max(0.02, Math.min(0.98, hsl[2] + dir)), [bg, bgs[1], soft]) || acc;
    root.style.setProperty('--accent', acc);
    root.style.setProperty('--accent-2', a2);
    root.style.setProperty('--accent-soft', soft);
    root.style.setProperty('--on-accent', onFor(acc));
  }

  /* ----------------------------- 偏好应用 ----------------------------- */
  function apply() {
    setAttr('data-font', state.font);
    setAttr('data-size', state.size);
    setAttr('data-lead', state.lead);
    setAttr('data-density', state.density);
    applyAccent();
  }
  function setAttr(name, v) {
    if (v) root.setAttribute(name, v);
    else root.removeAttribute(name);
  }

  /* ------------------------------- 面板 ------------------------------- */
  var rootEl = document.getElementById('lookRoot');
  if (!rootEl) return;

  function opts(group, list, cur) {
    return list.map(function (o) {
      var sw = o.id && o.id.charAt(0) === '#' ?
        '<span class="sw" style="background:' + o.id + '" aria-hidden="true"></span>' : '';
      return '<button type="button" class="look-opt" data-look-group="' + group + '" data-look-value="' +
        o.id + '" aria-pressed="' + (o.id === cur ? 'true' : 'false') + '">' + sw + o.name + '</button>';
    }).join('');
  }

  function themeCards(cur) {
    return THEMES.map(function (t) {
      return '<button type="button" class="look-theme" data-look-theme="' + t.id + '" aria-pressed="' +
        (t.id === cur ? 'true' : 'false') + '">' +
        '<span class="thumb"><img src="' + t.img + '" alt="' + t.alt + '" width="320" height="180" loading="lazy" decoding="async"></span>' +
        '<span class="bar" aria-hidden="true">' + t.bar.map(function (c) {
          return '<i style="background:' + c + '"></i>';
        }).join('') + '</span>' +
        '<span class="nm">' + t.name + '</span><span class="ds">' + t.desc + '</span>' +
        '<span class="lay">' + t.layout + '</span></button>';
    }).join('');
  }

  var curTheme = root.getAttribute('data-theme') || 'paper';

  rootEl.innerHTML =
    '<div class="look-mask" data-look-close></div>' +
    '<aside class="look" id="lookPanel" role="dialog" aria-modal="true" aria-labelledby="lookTitle" aria-hidden="true" tabindex="-1">' +
      '<div class="look-head">' +
        '<div><h2 id="lookTitle">外观</h2><p>模板、字体、字号、疏密与强调色，都随你。</p></div>' +
        '<button type="button" class="look-close" data-look-close aria-label="关闭外观面板">' +
          '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="look-body">' +
        '<div class="look-group"><h3>界面模板</h3>' +
          '<p class="look-note">五套气质不同的模板；右上角月亮是独立的暗色层，可与任意模板叠加。</p>' +
          '<div class="look-themes">' + themeCards(curTheme) + '</div></div>' +
        '<div class="look-group"><h3>字体</h3><div class="look-opts">' + opts('font', FONTS, state.font) + '</div></div>' +
        '<div class="look-group"><h3>字号</h3><div class="look-opts">' + opts('size', SIZES, state.size) + '</div></div>' +
        '<div class="look-group"><h3>行距</h3><div class="look-opts">' + opts('lead', LEADS, state.lead) + '</div></div>' +
        '<div class="look-group"><h3>版式疏密</h3><div class="look-opts">' + opts('density', DENS, state.density) + '</div></div>' +
        '<div class="look-group"><h3>强调色</h3>' +
          '<p class="look-note">选色后会自动校正明度，保证文字对比度不低于 4.5:1。</p>' +
          '<div class="look-opts">' + opts('accent', ACCENTS, state.accent) + '</div></div>' +
      '</div>' +
      '<div class="look-foot"><button type="button" class="look-reset" data-look-reset>恢复默认外观</button></div>' +
    '</aside>' +
    '<p class="sr-only" id="lookLive" aria-live="polite"></p>';

  var panel = document.getElementById('lookPanel');
  var live = document.getElementById('lookLive');
  var openBtn = document.getElementById('lookBtn');
  var lastFocus = null;

  function say(msg) { if (live) live.textContent = msg; }

  function openPanel() {
    lastFocus = document.activeElement;
    document.body.classList.add('look-open');
    panel.setAttribute('aria-hidden', 'false');
    if (openBtn) openBtn.setAttribute('aria-expanded', 'true');
    if (panel.focus) panel.focus();
  }
  function closePanel(restore) {
    document.body.classList.remove('look-open');
    panel.setAttribute('aria-hidden', 'true');
    if (openBtn) openBtn.setAttribute('aria-expanded', 'false');
    if (restore !== false) {
      if (lastFocus && lastFocus !== document.body && lastFocus.focus) lastFocus.focus();
      else if (openBtn) openBtn.focus();
    }
  }

  function syncTheme(cur) {
    Array.prototype.forEach.call(panel.querySelectorAll('[data-look-theme]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-look-theme') === cur ? 'true' : 'false');
    });
  }

  function setChoice(group, value) {
    state[group] = value;
    put(K[group], value);
    if (group === 'accent') applyAccent(); else apply();
    Array.prototype.forEach.call(panel.querySelectorAll('[data-look-group="' + group + '"]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-look-value') === value ? 'true' : 'false');
    });
  }

  panel.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest('[data-look-close]')) { closePanel(); return; }
    if (t.closest('[data-look-reset]')) {
      state = { font: '', size: '', lead: '', density: '', accent: '' };
      Object.keys(K).forEach(function (g) { put(K[g], ''); });
      apply();
      Array.prototype.forEach.call(panel.querySelectorAll('[data-look-group]'), function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-look-value') === '' ? 'true' : 'false');
      });
      say('已恢复默认外观');
      return;
    }
    var chip = t.closest('[data-look-group]');
    if (chip) {
      var g = chip.getAttribute('data-look-group');
      setChoice(g, chip.getAttribute('data-look-value'));
      say(chip.textContent.trim() + ' 已应用');
      return;
    }
    var card = t.closest('[data-look-theme]');
    if (card) {
      var id = card.getAttribute('data-look-theme');
      if (window.SY && window.SY.setTheme) window.SY.setTheme(id);
      else { root.setAttribute('data-theme', id); put('theme', id); }
      syncTheme(id);
      applyAccent();
      say(card.querySelector('.nm').textContent + ' 已应用');
    }
  });

  if (openBtn) {
    openBtn.addEventListener('click', function () {
      if (document.body.classList.contains('look-open')) closePanel(); else openPanel();
    });
  }

  document.addEventListener('keydown', function (e) {
    if (!document.body.classList.contains('look-open')) return;
    if (e.key === 'Escape') { e.preventDefault(); closePanel(); return; }
    if (e.key === 'Tab') {
      var f = panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* 模板/暗色由别处改动时，重算强调色并同步面板 */
  if (window.MutationObserver) {
    new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        if (muts[i].attributeName === 'data-theme') syncTheme(root.getAttribute('data-theme'));
        if (muts[i].attributeName === 'data-theme' || muts[i].attributeName === 'data-dark') applyAccent();
      }
    }).observe(root, { attributes: true, attributeFilter: ['data-theme', 'data-dark'] });
  }

  apply();

  window.SYLook = { open: openPanel, close: closePanel, state: state };
})();

</script>
</body>
</html>
