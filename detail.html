/* 首帧前套用已保存的模板与明暗，避免深色偏好用户看到白屏闪一下 */
(function () {
  try {
    var r = document.documentElement, t = localStorage.getItem('shiying:theme');
    if (t) { t = JSON.parse(t); if (t === 'paper' || t === 'cinema' || t === 'grid' || t === 'ink' || t === 'mono') r.setAttribute('data-theme', t); }
    var d = localStorage.getItem('shiying:dark');
    if (d === null) d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    else d = JSON.parse(d);
    r.setAttribute('data-dark', d ? 'true' : 'false');
    var map = { lookFont: 'data-font', lookSize: 'data-size', lookLead: 'data-lead', lookDensity: 'data-density' };
    Object.keys(map).forEach(function (k) {
      var v = localStorage.getItem('shiying:' + k);
      if (!v) return;
      try { v = JSON.parse(v); } catch (e2) { return; }
      if (typeof v === 'string' && v) r.setAttribute(map[k], v);
    });
  } catch (e) { /* 隐私模式下 localStorage 不可用，用默认模板 */ }
})();
</script>

/* ------------------------------- 基础 ------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px;color-scheme:light}
html[data-dark="true"]{color-scheme:dark}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:16px;line-height:var(--lh);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .3s ease,color .3s ease;
  background-image:var(--grid-dots);
}
img{max-width:100%;display:block}
a{color:var(--accent);text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,h4,h5,h6{margin:0;font-family:var(--font-head);color:var(--text-strong);line-height:1.32;letter-spacing:var(--head-ls)}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
::selection{background:var(--accent-soft);color:var(--text-strong)}
[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.skip-link{position:fixed;left:14px;top:-70px;z-index:400;background:var(--accent);color:var(--on-accent);
  padding:11px 20px;border-radius:var(--r-sm);font-weight:600;transition:top .2s}
.skip-link:focus{top:12px;text-decoration:none}

/* 未启用 JavaScript 时的提示 */
.noscript-note{margin:0;padding:14px 22px;background:var(--accent-soft);color:var(--text);
  border-bottom:1px solid var(--line);font-size:14px;line-height:1.7}

/* 顶部阅读进度条 */
#progressBar{position:fixed;inset:0 auto auto 0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  z-index:320;transition:width .15s linear;border-radius:0 2px 2px 0}

/* ------------------------------- 顶栏 ------------------------------- */
.topbar{
  position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:12px;
  height:64px;padding:0 clamp(12px,2.4vw,30px);
  background:var(--bg);border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
}
@supports not (background:color-mix(in srgb,red 50%,blue)){.topbar{background:var(--bg)}}
.brand{display:flex;align-items:center;gap:10px;color:var(--text-strong);font-family:var(--font-head);
  font-size:22px;font-weight:700;letter-spacing:.14em;text-decoration:none;flex-shrink:0}
.brand:hover{text-decoration:none}
.brand .seal{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--on-accent);font-size:17px;letter-spacing:0;line-height:1;
  font-family:var(--font-head);box-shadow:var(--shadow-sm)}
.brand .en{font-family:var(--font-body);font-size:10px;letter-spacing:var(--label-ls);
  color:var(--faint);font-weight:600;text-transform:uppercase;display:none}
@media(min-width:1180px){.brand .en{display:block}}
.spacer{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--panel);color:var(--muted);font-size:13.5px;font-weight:600;
  transition:.18s;flex-shrink:0;white-space:nowrap}
.tb-btn:hover{border-color:var(--accent);color:var(--accent)}
.tb-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.icon-only{padding:0;width:38px;justify-content:center}
.progress-chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border:1px solid var(--line);
  border-radius:999px;background:var(--panel);font-size:12.5px;color:var(--muted);white-space:nowrap}
.progress-chip b{color:var(--accent);font-variant-numeric:tabular-nums;font-size:13.5px}
@media(max-width:1180px){.progress-chip .pc-label{display:none}}
@media(max-width:1080px){.progress-chip{display:none}}
#tocBtn{display:none}
@media(max-width:1040px){#tocBtn{display:inline-flex}}

/* 搜索 */
.search-wrap{position:relative;flex:0 1 250px;min-width:0}
.search-wrap svg.s-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2;pointer-events:none}
.search-wrap input{width:100%;height:38px;padding:0 34px 0 35px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);font-size:14px;outline:none;transition:.18s}
.search-wrap input::placeholder{color:var(--faint)}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:26px;height:26px;
  display:none;place-items:center;border-radius:50%;color:var(--muted);font-size:16px;line-height:1}
.search-clear:hover{background:var(--panel-2);color:var(--accent)}
.search-clear.show{display:grid}
#searchToggle{display:none}
@media(max-width:900px){
  .search-wrap{display:none}
  body.search-open .search-wrap{display:block;position:absolute;left:10px;right:10px;top:70px;
    flex:1 1 auto;z-index:310;background:var(--panel);padding:8px;border:1px solid var(--line);
    border-radius:calc(var(--r-sm) + 6px);box-shadow:var(--shadow)}
  body.search-open .search-wrap input{height:42px}
  #searchToggle{display:inline-flex}
}

/* 主题菜单 */
.theme-wrap{position:relative}
.theme-menu{position:absolute;right:0;top:46px;width:296px;padding:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:none;z-index:320}
.theme-menu.open{display:block;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.theme-menu .tm-title{font-size:11px;letter-spacing:var(--label-ls);color:var(--faint);
  padding:6px 10px 8px;font-weight:700}
.theme-menu button.tm-item{display:flex;gap:10px;width:100%;text-align:left;padding:9px 10px;
  border-radius:var(--r-sm);transition:.15s}
.theme-menu button.tm-item:hover{background:var(--panel-2)}
.theme-menu button.tm-item[aria-checked="true"]{background:var(--accent-soft)}
.tm-swatch{flex:0 0 auto;width:34px;height:34px;border-radius:6px;border:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.tm-swatch i{display:block}
.tm-name{display:block;font-size:13.5px;font-weight:700;color:var(--text-strong);line-height:1.5}
.tm-desc{display:block;font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:1px}
.theme-menu hr{border:0;border-top:1px solid var(--line);margin:6px 8px}
.tm-foot{font-size:11.5px;color:var(--muted);line-height:1.65;padding:6px 10px 8px}

/* ------------------------------- 布局 ------------------------------- */
.layout{display:flex;align-items:flex-start;max-width:1560px;margin:0 auto}

/* 侧栏目录 */
.toc{
  position:sticky;top:64px;flex:0 0 var(--toc-w);width:var(--toc-w);height:calc(100vh - 64px);
  overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--line);
  padding:22px 10px 60px 18px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;
  background:var(--bg);
}
.toc::-webkit-scrollbar{width:7px}
.toc::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
.toc-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 12px}
.toc-head .t{font-size:11px;letter-spacing:var(--label-ls);font-weight:700;color:var(--faint);text-transform:uppercase}
.toc-close{display:none;width:30px;height:30px;place-items:center;border-radius:50%;color:var(--muted)}
.toc-close:hover{background:var(--panel-2);color:var(--accent)}
.toc-hint{font-size:11px;color:var(--faint);line-height:1.6;padding:0 8px 12px;
  border-bottom:1px solid var(--line);margin-bottom:10px}
.toc-block{margin-bottom:2px}
.toc-ch-row{display:flex;align-items:stretch;gap:2px;border-radius:var(--r-sm);transition:.15s}
.toc-ch-row:hover{background:var(--panel-2)}
.toc-ch{display:flex;gap:9px;align-items:baseline;padding:8px 4px 8px 9px;flex:1;min-width:0;
  color:var(--text-strong);font-weight:700;font-size:13.5px;line-height:1.5;border-radius:var(--r-sm);transition:.15s}
.toc-ch:hover{text-decoration:none}
.toc-ch .n{font-size:10.5px;letter-spacing:.06em;color:var(--faint);font-variant-numeric:tabular-nums;
  font-weight:700;flex-shrink:0}
.toc-ch-toggle{flex:0 0 30px;display:grid;place-items:center;border:0;background:none;color:var(--faint);
  border-radius:var(--r-sm);cursor:pointer}
.toc-ch-toggle:hover{color:var(--accent)}
.toc-ch-toggle svg{width:13px;height:13px;transition:transform .2s}
.toc-block.is-open .toc-ch-toggle svg{transform:rotate(90deg)}
.toc-block.is-current>.toc-ch-row{background:var(--accent)}
.toc-block.is-current>.toc-ch-row .toc-ch{color:var(--on-accent)}
.toc-block.is-current>.toc-ch-row .toc-ch .n{color:var(--on-accent);opacity:.75}
.toc-block.is-current>.toc-ch-row .toc-ch-toggle{color:var(--on-accent)}
.toc-block.is-current>.toc-ch-row:hover{text-decoration:none}
.toc-secs{margin:1px 0 8px 14px;padding-left:8px;border-left:1px solid var(--line);display:none}
.toc-block.is-open .toc-secs{display:block}
.toc-sec{position:relative}
.toc-sec-link{display:block;font-size:12px;line-height:1.55;color:var(--muted);padding:5px 26px 5px 8px;
  border-radius:6px;transition:.15s;word-break:break-word}
.toc-sec-link:hover{color:var(--accent);background:var(--panel-2);text-decoration:none}
.toc-sec.is-current>.toc-sec-link{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.toc-sec-toggle{position:absolute;right:0;top:2px;width:24px;height:24px;display:grid;place-items:center;
  color:var(--faint);border-radius:5px;transition:.15s}
.toc-sec-toggle:hover{color:var(--accent);background:var(--panel-2)}
.toc-sec-toggle svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.toc-sec.is-open .toc-sec-toggle svg{transform:rotate(90deg)}
.toc-leaves{list-style:none;margin:0 0 4px;padding:0 0 0 6px;display:none}
.toc-sec.is-open>.toc-leaves,.toc-sec.is-current>.toc-leaves{display:block}
.toc-leaves a{display:block;font-size:11.5px;line-height:1.5;color:var(--faint);padding:3px 6px;
  border-radius:5px;word-break:break-word;transition:.15s}
.toc-leaves a:hover{color:var(--accent);background:var(--panel-2);text-decoration:none}
.toc-leaves a.is-active{color:var(--accent);font-weight:700}
.toc-foot{margin-top:14px;padding:12px 9px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.7}

main{flex:1;min-width:0;padding-bottom:0}
.mask{position:fixed;inset:0;background:rgba(10,8,6,.55);z-index:340;opacity:0;visibility:hidden;
  transition:.22s;backdrop-filter:blur(2px)}
body.toc-open .mask{opacity:1;visibility:visible}

/* ------------------------------- Hero ------------------------------- */
.hero{position:relative;min-height:clamp(460px,64vh,670px);display:flex;align-items:flex-end;
  overflow:hidden;background:#221d18;color:#fff;isolation:isolate}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;background:var(--hero-grad);z-index:-1}
.hero-inner{padding:clamp(40px,7vw,86px) clamp(20px,6vw,80px) clamp(44px,6vw,74px);max-width:900px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:var(--label-ls);
  text-transform:uppercase;color:rgba(255,255,255,.82);margin-bottom:20px;font-weight:600}
.hero .eyebrow::before{content:"";width:34px;height:1px;background:rgba(255,255,255,.6)}
.hero h1{font-size:clamp(60px,10vw,112px);line-height:1;margin:0 0 16px;letter-spacing:.16em;
  color:#fff;text-shadow:0 4px 40px rgba(0,0,0,.4);font-weight:700}
.hero .subtitle{font-family:var(--font-head);font-size:clamp(17px,2.1vw,24px);line-height:1.75;
  color:#f8f1e6;margin:0 0 14px;max-width:620px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero .lede{font-size:14.5px;line-height:1.9;color:rgba(255,255,255,.8);max-width:560px;margin:0 0 30px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;
  border-radius:var(--r-sm);font-size:14.5px;font-weight:700;transition:.2s;border:1px solid transparent;
  text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover{text-decoration:none;transform:translateY(-2px)}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);
  box-shadow:0 10px 26px rgba(0,0,0,.22)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.5);
  backdrop-filter:blur(6px)}
.btn-ghost:hover{background:rgba(255,255,255,.18)}
.hero-credit{position:absolute;right:16px;top:16px;z-index:3;font-size:11px;line-height:1.7;
  color:rgba(255,255,255,.86);text-align:right;max-width:min(56%,430px);
  padding:5px 9px;border-radius:8px;background:rgba(12,10,8,.62);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.hero-credit a{color:#fff;text-decoration:underline;text-decoration-color:rgba(255,255,255,.55)}
.hero-credit .pid{opacity:.7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}

/* 学习路径 */
.path{max-width:1140px;margin:-38px auto 0;padding:0 22px;position:relative;z-index:5}
.path-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.path-step{background:var(--panel);padding:22px 24px;position:relative}
.path-step .k{font-size:10.5px;letter-spacing:var(--label-ls);color:var(--accent);font-weight:700}
.path-step h3{margin:7px 0 5px;font-size:17px}
.path-step p{font-size:13px;color:var(--muted);line-height:1.72}

/* ------------------------------- 章节 ------------------------------- */
.chapters{max-width:1140px;margin:0 auto;padding:0 22px}
.chapter{padding:72px 0 48px;border-bottom:1px solid var(--line);scroll-margin-top:80px}
.chapter:last-of-type{border-bottom:0}
.chapter-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.chapter-num{flex:0 0 auto;font-size:11px;letter-spacing:.14em;color:var(--accent);
  border:1px solid var(--accent);border-radius:999px;padding:4px 12px;margin-top:10px;font-weight:700;
  font-variant-numeric:tabular-nums}
.chapter-head h2{flex:1 1 340px;font-size:clamp(26px,3.6vw,38px);min-width:0}
.read-btn{flex:0 0 auto;margin-top:4px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:600;transition:.18s}
.read-btn:hover{border-color:var(--accent);color:var(--accent)}
.read-btn.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chapter-meta{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 22px;font-size:11.5px;color:var(--faint)}
.chapter-meta span{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.chapter-intro{font-family:var(--font-head);font-size:16px;line-height:2;color:var(--muted);
  max-width:860px;margin:0 0 28px;padding-left:18px;border-left:3px solid var(--accent-soft)}
.chapter[data-n="1"] .chapter-intro{padding-left:0;border-left:0;position:relative;font-size:16.5px;
  color:var(--text);max-width:900px}
html[data-theme="paper"] .chapter[data-n="1"] .chapter-intro{font-size:17.5px;line-height:2.05}
html[data-theme="paper"] .chapter[data-n="1"] .chapter-intro::before{
  content:"“";display:block;font-size:52px;line-height:.5;color:var(--accent);opacity:.35;
  margin-bottom:10px;font-family:Georgia,serif}
html[data-theme="cinema"] .chapter[data-n="1"] .chapter-intro{font-size:19px;line-height:1.9;
  letter-spacing:.01em;border-left:2px solid var(--accent);padding-left:20px}

/* 配图 */
.figure{margin:0 0 32px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--fig-r);overflow:hidden;position:relative}
html[data-theme="cinema"] .figure{border:0;margin-left:calc(-1 * clamp(0px,2vw,22px));
  margin-right:calc(-1 * clamp(0px,2vw,22px))}
.figure .ph{position:relative;aspect-ratio:16/7;background:var(--panel-2);overflow:hidden}
.figure img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.figure:hover img{transform:scale(1.015)}
.figure figcaption{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;
  flex-wrap:wrap;padding:10px 16px;font-size:12px;line-height:1.65;color:var(--muted);
  background:var(--panel);border-top:1px solid var(--line)}
.figure .cap{flex:1 1 300px}
.figure .credit{font-size:11px;color:var(--faint);white-space:nowrap}
.figure.img-error .ph::after{content:"📷 图片暂不可用 · 已切换为纯色占位";position:absolute;inset:0;
  display:grid;place-items:center;font-size:13px;color:var(--muted);letter-spacing:.06em;
  background:repeating-linear-gradient(135deg,var(--panel-2),var(--panel-2) 12px,var(--bg-2) 12px,var(--bg-2) 24px)}
.figure.img-error img{visibility:hidden}

/* 参数对比表 */
.cmp{margin:0 0 34px}
.cmp-title{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font-size:11px;
  letter-spacing:var(--label-ls);color:var(--faint);font-weight:700;text-transform:uppercase}
.cmp-title b{font-family:var(--font-head);font-size:15px;letter-spacing:.02em;color:var(--text-strong);
  text-transform:none;font-weight:700}
.cmp-scroll{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  -webkit-overflow-scrolling:touch}
.cmp table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.cmp caption{text-align:left;padding:10px 16px 0;font-size:12px;color:var(--faint)}
.cmp th,.cmp td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);
  line-height:1.65}
.cmp thead th{background:var(--panel-2);color:var(--text-strong);font-size:12px;letter-spacing:.04em;
  font-weight:700;white-space:nowrap;position:sticky;top:0}
.cmp tbody th{color:var(--text-strong);font-weight:700;white-space:nowrap;background:var(--panel)}
.cmp td{color:var(--muted)}
.cmp tbody tr:last-child th,.cmp tbody tr:last-child td{border-bottom:0}
.cmp tbody tr:hover td,.cmp tbody tr:hover th{background:var(--panel-2)}
.cmp .hint{padding:10px 16px;font-size:12px;color:var(--faint);border-top:1px solid var(--line);
  background:var(--panel-2);margin:0}

/* 小节（二级标题） */
.unit{margin:0 0 16px;border:1px solid var(--unit-border);border-radius:var(--unit-radius);
  background:var(--unit-bg);overflow:hidden;box-shadow:var(--shadow-sm);scroll-margin-top:84px}
html[data-theme="paper"] .unit{box-shadow:none;border-color:var(--line)}
html[data-theme="cinema"] .unit{box-shadow:none;border-top:1px solid var(--line-strong);
  border-bottom:1px solid var(--line);margin-bottom:0}
html[data-theme="cinema"] .unit:last-of-type{margin-bottom:20px}
.unit-h{margin:0}
.unit-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 18px;
  color:var(--text-strong);font-family:var(--font-head);font-size:17px;font-weight:700;
  transition:.16s;line-height:1.45}
.unit-head:hover{background:var(--panel-2)}
.unit-head .u-no{font-family:var(--font-body);font-size:11px;letter-spacing:.08em;color:var(--accent);
  font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;min-width:26px}
.unit-head .u-title{flex:1;min-width:0}
.unit-head .u-count{font-family:var(--font-body);font-size:11px;color:var(--faint);font-weight:600;
  flex-shrink:0;font-variant-numeric:tabular-nums}
.unit-head .chev{flex-shrink:0;width:16px;height:16px;color:var(--accent);transition:transform .22s;
  fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.unit[data-open="false"] .unit-head .chev{transform:rotate(-90deg)}
.unit-body{display:grid;grid-template-columns:var(--unit-cols);gap:12px;padding:0 18px 16px}
.unit-body>*{min-width:0}
.unit[data-open="false"] .unit-body{display:none}
html[data-theme="cinema"] .unit-body{padding:2px 18px 20px;gap:0}
html[data-theme="cinema"] .unit-body>.item{background:transparent;border:0;border-radius:0;
  border-top:1px solid var(--line);padding:16px 2px}
html[data-theme="cinema"] .unit-body>.item:first-child{border-top:0;padding-top:4px}

/* 条目（三级标题） */
.item{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);
  transition:.18s;scroll-margin-top:86px}
.item:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.item-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.tag{flex-shrink:0;font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:4px;
  font-weight:700;line-height:1.7;border:1px solid transparent;white-space:nowrap;margin-top:2px}
.tag[data-t="理论"]{background:var(--tag-theory-bg);color:var(--tag-theory-fg);border-color:var(--tag-theory-bd)}
.tag[data-t="实操"]{background:var(--tag-do-bg);color:var(--tag-do-fg);border-color:var(--tag-do-bd)}
.tag[data-t="提示"]{background:var(--tag-tip-bg);color:var(--tag-tip-fg);border-color:var(--tag-tip-bd)}
html[data-theme="cinema"] .tag{border-radius:0;letter-spacing:.14em}
.item h4{font-size:13.5px;font-weight:700;line-height:1.6;color:var(--text-strong);flex:1;min-width:0;
  font-family:var(--font-body);letter-spacing:0}
.item-text{font-size:13.5px;line-height:1.85;color:var(--muted)}
.item-detail{display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-size:12px;font-weight:700;
  color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:.15s}
.item-detail:hover{border-bottom-color:var(--accent);text-decoration:none}
.item-detail span{transition:transform .18s}
.item-detail:hover span{transform:translateX(3px)}
.item-body-note{font-size:10.5px;color:var(--faint);margin-top:6px}

/* 题材卡片网格 */
.unit.is-cards .unit-body{--unit-cols:repeat(auto-fill,minmax(248px,1fr))}
html[data-theme="cinema"] .unit.is-cards .unit-body{--unit-cols:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.unit-body>.genre-fig{grid-column:1/-1;margin:0 0 4px;aspect-ratio:auto}
.unit-body>.genre-fig .ph{aspect-ratio:21/6.6}
.unit-body>.genre-fig .ph img{object-position:var(--pos,50% 50%)}
html[data-theme="cinema"] .unit-body>.genre-fig{margin:0 0 6px;
  margin-left:calc(-1 * clamp(0px,2vw,22px));margin-right:calc(-1 * clamp(0px,2vw,22px))}
html[data-theme="cinema"] .unit-body>.genre-fig .ph{aspect-ratio:21/7}
.topic-card{padding:15px 16px 16px}
html[data-theme="cinema"] .unit.is-cards .topic-card{padding:14px 16px}
.topic-card .body{padding:0}
.topic-card .item-head{margin-bottom:6px}
.topic-card.img-error .body::before{content:"图片暂不可用";font-size:11px;color:var(--faint);
  letter-spacing:.06em;display:block;margin-bottom:4px}

/* 条目内层（无图时与有图时的统一内边距） */
.item-inner{padding:0}
.unit-body>.item:not(.topic-card) .item-text{margin:0}

/* 曝光三要素示意图 */
.tri-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:16px 22px;margin:0 0 30px;color:var(--accent)}
.tri-wrap svg.tri{flex:0 0 auto;width:220px;max-width:100%;height:auto;color:var(--accent);overflow:visible}
.tri-wrap svg.tri text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.tri-wrap svg.tri circle{fill:var(--accent)}
.tri-text{flex:1 1 240px;min-width:210px;font-size:13px;line-height:1.8;color:var(--muted)}
.tri-text b{color:var(--text-strong)}

/* 术语 */
/* 术语提示：默认 display:none；显示时用 position:fixed + JS 定位，永不参与布局、也不撑出滚动条 */
.term{border-bottom:1px dashed var(--accent);cursor:help;position:relative;color:var(--text-strong);
  text-decoration:none}
.term::after{content:attr(data-tip);display:none;position:fixed;left:var(--tip-x,0);top:var(--tip-y,0);
  transform:translateY(var(--tip-ty,-100%));width:max-content;
  max-width:min(280px,calc(100vw - 32px));white-space:normal;background:var(--text-strong);color:var(--bg);
  padding:9px 12px;border-radius:6px;font-size:12px;line-height:1.65;z-index:80;
  pointer-events:none;box-shadow:var(--shadow);font-family:var(--font-body);letter-spacing:0;font-weight:400}
.term:hover::after,.term:focus::after,.term:focus-visible::after{display:block}
@media (prefers-reduced-motion:no-preference){
  .term:hover::after,.term:focus::after,.term:focus-visible::after{animation:tipIn .16s ease-out}
  @keyframes tipIn{from{opacity:0}to{opacity:1}}
}
mark{background:var(--accent-soft);color:var(--text-strong);border-radius:3px;padding:0 2px}

/* 章末 */
.chapter-end{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
.end-box{padding:18px 20px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.end-box h4{margin:0 0 7px;font-size:13px;letter-spacing:var(--label-ls);color:var(--accent);
  text-transform:uppercase;font-family:var(--font-body);font-weight:700}
.end-box p{font-size:13.5px;line-height:1.85;color:var(--muted)}
.end-box.practice{background:var(--accent-soft);border-color:transparent}
.end-box.practice h4{color:var(--accent-2)}
.end-box.practice p{color:var(--text)}
.further{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 0}
.further .lbl{font-size:11.5px;color:var(--faint);margin-right:2px}
.further a{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:7px 13px;
  border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);transition:.16s}
.further a:hover{border-color:var(--accent);color:var(--accent);text-decoration:none;transform:translateY(-1px)}

/* 搜索状态 */
.search-bar{max-width:1140px;margin:26px auto 0;padding:0 22px;display:none}
.search-bar.show{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.search-bar b{color:var(--accent);font-variant-numeric:tabular-nums}
.search-bar .reset{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;
  color:var(--muted);background:var(--panel)}
.search-bar .reset:hover{border-color:var(--accent);color:var(--accent)}
.empty{display:none;text-align:center;padding:90px 20px;color:var(--muted)}
.empty.show{display:block}
.empty .big{font-size:46px;margin-bottom:14px;opacity:.6}
.empty h3{font-size:20px;margin-bottom:8px}
.empty p{font-size:13.5px;line-height:1.8}
.empty .tips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.empty .tips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:6px 14px;font-size:12.5px;color:var(--muted)}
.empty .tips button:hover{border-color:var(--accent);color:var(--accent)}

/* 页脚 */
.site-foot{border-top:1px solid var(--line);background:var(--panel-2);margin-top:40px;
  padding:48px 22px 56px}
.foot-in{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}
.foot-brand .fb{font-family:var(--font-head);font-size:24px;letter-spacing:.2em;color:var(--text-strong);
  display:flex;align-items:center;gap:10px}
.foot-brand .fb .seal{width:30px;height:30px;font-size:16px}
.foot-brand p{font-size:12.5px;color:var(--muted);line-height:1.85;margin-top:12px;max-width:340px}
.foot-col h4{font-size:11px;letter-spacing:var(--label-ls);color:var(--faint);text-transform:uppercase;
  margin-bottom:10px;font-family:var(--font-body);font-weight:700}
.foot-col ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.foot-col a{font-size:12.5px;color:var(--muted)}
.foot-col a:hover{color:var(--accent)}
.foot-base{max-width:1140px;margin:34px auto 0;padding-top:18px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--faint)}
.foot-base .keys kbd{font-family:ui-monospace,monospace;font-size:10.5px;border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;background:var(--panel);color:var(--muted)}

/* 回到顶部 */
#toTop{position:fixed;right:20px;bottom:22px;z-index:250;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);color:var(--accent);box-shadow:var(--shadow);
  display:grid;place-items:center;opacity:0;visibility:hidden;transform:translateY(8px);transition:.22s}
#toTop.show{opacity:1;visibility:visible;transform:none}
#toTop:hover{border-color:var(--accent);transform:translateY(-3px)}
#toTop svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 目录脉冲（桌面端“查看目录”） */
@keyframes tocFlash{0%,100%{box-shadow:inset 0 0 0 0 rgba(0,0,0,0)}30%{box-shadow:inset 0 0 0 3px var(--accent)}
  60%{box-shadow:inset 0 0 0 1px var(--accent)}}
.toc.flash{animation:tocFlash .9s ease}

/* 链接样按钮 & 术语弹层 */
.linklike{padding:0;font-size:12.5px;color:var(--muted);text-align:left}
.linklike:hover{color:var(--accent);text-decoration:underline}
kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;background:var(--panel);color:var(--muted)}
#glossaryDialog{width:min(760px,92vw);max-height:84vh;padding:0;border:1px solid var(--line);
  border-radius:var(--r);background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
#glossaryDialog::backdrop{background:rgba(8,6,4,.58);backdrop-filter:blur(3px)}
.gloss-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.gloss-head h2{font-size:18px}
.gloss-close{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted);
  font-size:20px;line-height:1}
.gloss-close:hover{background:var(--panel-2);color:var(--accent)}
.gloss-list{padding:8px 20px 22px;overflow-y:auto}
.gloss-item{padding:11px 0;border-bottom:1px solid var(--line)}
.gloss-item:last-child{border-bottom:0}
.gloss-item dt{font-family:var(--font-head);font-size:14.5px;font-weight:700;color:var(--accent);margin-bottom:3px}
.gloss-item dd{margin:0;font-size:13.5px;line-height:1.8;color:var(--muted)}

/* ------------------------------- 响应式 ------------------------------- */
@media (max-width:1180px){ .foot-in{grid-template-columns:1fr 1fr} }
@media (max-width:1040px){
  .toc{position:fixed;top:0;left:0;z-index:350;height:100dvh;width:min(88vw,340px);
    transform:translateX(-102%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    box-shadow:var(--shadow);padding-top:18px;border-right:1px solid var(--line)}
  body.toc-open .toc{transform:none}
  body.toc-open{overflow:hidden}
  .toc-close{display:grid}
  .toc-block.is-open .toc-secs{display:block}
  /* 触屏上把「整章收起」按钮放大到 40×40，避免误点 */
  .toc-ch{padding:10px 4px 10px 10px}
  .toc-ch-toggle{flex:0 0 40px}
  .toc-sec-toggle{width:32px;height:32px;top:0}
  .path-grid{grid-template-columns:1fr}
  .chapter-end{grid-template-columns:1fr}
}
@media (max-width:760px){
  .topbar{height:58px;gap:8px;padding:0 10px}
  .brand{font-size:19px;gap:8px}
  .brand .seal{width:29px;height:29px;font-size:15px}
  .tb-btn{height:36px;font-size:13px;padding:0 10px}
  .icon-only{width:36px}
  .hero{min-height:540px}
  .hero h1{font-size:clamp(54px,15vw,76px)}
  .hero-inner{padding:34px 18px 46px}
  .hero .lede{font-size:13.5px}
  .hero-credit{font-size:10px;right:10px;top:10px;bottom:auto;max-width:74%}
  .path{margin-top:-24px;padding:0 14px}
  .chapters{padding:0 14px}
  .chapter{padding:52px 0 38px}
  .chapter-head{gap:10px}
  .chapter-head h2{font-size:clamp(22px,6.4vw,28px);flex:1 1 100%}
  .read-btn{margin-top:0}
  .chapter-intro{font-size:15px;padding-left:14px}
  .hero-credit .pid{display:none}
  .unit-head{font-size:15.5px;padding:13px 14px}
  .unit-body{padding:0 14px 14px;--unit-cols:1fr !important}
  .unit.is-cards .unit-body{--unit-cols:1fr !important}
  .figure .ph{aspect-ratio:4/3}
  .figure figcaption{font-size:11.5px;padding:9px 12px}
  .cmp table{min-width:520px;font-size:12.5px}
  .cmp th,.cmp td{padding:9px 11px}
  .foot-in{grid-template-columns:1fr;gap:26px}
  #toTop{right:12px;bottom:14px;width:40px;height:40px}
  .search-bar{padding:0 14px}
  .end-box{padding:15px 16px}
}
@media (max-width:400px){
  .brand{font-size:17px}
  .brand .en{display:none}
  .hero-credit .pid{display:none}
}

/* ===================== 外观偏好（字体 / 字号 / 行距 / 密度） =====================
   由 look.js 写在 <html> 上的 data-* 属性驱动，和主题、明暗互不干扰：
   data-font   = serif | sans          标题/正文的字体方案
   data-size   = s | m | l | xl        字号档
   data-lead   = tight | normal | loose
   data-density= airy | compact       版式疏密
   强调色由 JS 计算后以行内变量覆盖 --accent / --accent-2 / --accent-soft / --on-accent。
   ============================================================================ */
html{--ts:1}
html[data-size="s"]{--ts:.94}
html[data-size="l"]{--ts:1.08}
html[data-size="xl"]{--ts:1.16}

body{font-size:calc(16px * var(--ts))}
.chapter-intro{font-size:calc(16px * var(--ts))}
.item-text{font-size:calc(13.5px * var(--ts))}
.item h4{font-size:calc(13.5px * var(--ts))}
.tri-text{font-size:calc(13px * var(--ts))}
.hero .lede{font-size:calc(14.5px * var(--ts))}
.hero .subtitle{font-size:clamp(calc(17px * var(--ts)),2.1vw,calc(23px * var(--ts)))}
.chapter-head h2{font-size:clamp(calc(26px * var(--ts)),3.6vw,calc(36px * var(--ts)))}
.unit-head .u-title{font-size:calc(15.5px * var(--ts))}
.toc-sec-link{font-size:calc(12px * var(--ts))}
.toc-leaves a{font-size:calc(11.5px * var(--ts))}
.dt-h1{font-size:clamp(calc(28px * var(--ts)),3.4vw,calc(40px * var(--ts)))}
.dt-p{font-size:calc(15px * var(--ts))}
.dt-lead{font-size:calc(16px * var(--ts))}
.dt-steps li{font-size:calc(14px * var(--ts))}
.dt-mistakes li{font-size:calc(14px * var(--ts))}
.dt-kw span{font-size:calc(12px * var(--ts))}

/* 字体方案：不设 data-font 时用各主题自带的搭配 */
html[data-font="serif"]{
  --font-head:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --font-body:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
}
html[data-font="sans"]{
  --font-head:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}

/* 行距 */
html[data-lead="tight"]{--lh:1.72}
html[data-lead="loose"]{--lh:2.12}
html[data-lead="tight"] .chapter-intro,
html[data-lead="tight"] .dt-p,
html[data-lead="tight"] .item-text{line-height:1.75}

/* 版式疏密 */
html[data-density="compact"] .chapter{margin-bottom:26px;padding-bottom:22px}
html[data-density="compact"] .unit{margin-bottom:10px}
html[data-density="compact"] .unit-head{padding:11px 16px}
html[data-density="compact"] .unit-body{padding:0 16px 12px;gap:9px}
html[data-density="compact"] .item{padding:13px 15px}
html[data-density="compact"] .hero{padding-bottom:26px}
html[data-density="compact"] .path-grid{gap:12px}
html[data-density="compact"] .path-card{padding:16px 18px}
html[data-density="compact"] .chapter-end{gap:12px;margin-top:20px}

/* ------------------------------ 外观面板 ------------------------------ */
.look-mask{position:fixed;inset:0;background:rgba(18,14,10,.44);z-index:380;opacity:0;
  pointer-events:none;transition:opacity .24s}
body.look-open .look-mask{opacity:1;pointer-events:auto}
.look{position:fixed;top:0;right:0;z-index:390;height:100dvh;width:min(92vw,344px);
  background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);
  transform:translateX(102%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column}
body.look-open .look{transform:none}
.look-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.look-head h2{margin:0;font-size:15px;letter-spacing:.06em;font-family:var(--font-head)}
.look-head p{margin:2px 0 0;font-size:11.5px;color:var(--faint);line-height:1.5}
.look-close{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.look-close:hover{background:var(--panel-2);color:var(--accent)}
.look-body{flex:1;overflow:auto;padding:6px 18px 18px;overscroll-behavior:contain}
.look-group{padding:16px 0;border-bottom:1px solid var(--line)}
.look-group:last-of-type{border-bottom:0}
.look-group h3{margin:0 0 4px;font-size:11.5px;letter-spacing:.16em;color:var(--faint);
  font-weight:700;text-transform:uppercase;font-family:var(--font-body)}
.look-group .look-note{margin:0 0 10px;font-size:11.5px;color:var(--faint);line-height:1.6}
.look-opts{display:flex;flex-wrap:wrap;gap:8px}
.look-opt{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;min-height:38px;
  border:1px solid var(--line);border-radius:var(--r-sm);font-size:12.5px;color:var(--text);
  background:var(--panel-2);transition:.16s}
.look-opt:hover{border-color:var(--accent);color:var(--accent)}
.look-opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:600}
.look-opt .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:0 0 auto}
.look-themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.look-theme{display:flex;flex-direction:column;gap:7px;padding:9px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--panel-2);text-align:left;transition:.16s}
.look-theme:hover{border-color:var(--accent)}
.look-theme[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.look-theme .bar{display:flex;height:14px;border-radius:3px;overflow:hidden;margin-top:-2px}
.look-theme .bar i{flex:1}
.look-theme .thumb{display:block;position:relative;aspect-ratio:16/9;border-radius:3px;
  overflow:hidden;background:var(--panel)}
.look-theme .thumb img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .4s ease,filter .3s}
.look-theme[data-look-theme="mono"] .thumb img{filter:grayscale(1) contrast(1.05)}
.look-theme:hover .thumb img{transform:scale(1.04)}
.look-theme .nm{font-size:12px;color:var(--text);font-weight:600;margin-top:2px}
.look-theme .ds{font-size:10.5px;color:var(--faint);line-height:1.4}
.look-theme .lay{font-size:10px;color:var(--accent);line-height:1.45;letter-spacing:.02em}
.look-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
.look-reset{flex:1;padding:11px;border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:13px;color:var(--muted);transition:.16s}
.look-reset:hover{border-color:var(--accent);color:var(--accent)}

@media (max-width:560px){
  .look{width:100vw}
  /* 窄屏上模板入口由外观面板承担，顶栏只留目录/搜索/外观/暗色四个按钮 */
  .topbar .theme-wrap{display:none}
  .dt-top-actions .theme-wrap{display:none}
}

/* --------------------------- 减少动态 --------------------------- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
  .figure:hover img,.topic-card:hover .ph img{transform:none}
}

/* ------------------------- 作品赏析 / 图库推荐 ------------------------- */
.works{max-width:1240px;margin:64px auto 0;padding:0 clamp(16px,4vw,40px)}
.works-head{text-align:center;margin-bottom:34px}
.works-head .eyebrow{justify-content:center}
.works-head h2{font-family:var(--font-head);font-size:clamp(25px,4vw,36px);
  font-weight:600;color:var(--text-strong);margin:8px 0 12px;letter-spacing:.04em}
.works-lede{max-width:760px;margin:0 auto;color:var(--muted);font-size:14.5px;line-height:1.9}
.works-jump{max-width:760px;margin:14px auto 0;font-size:13.5px;color:var(--muted);line-height:1.8}
.works-jump a{color:var(--accent);font-weight:600;border-bottom:1px solid var(--accent)}
/* 第十一章：章节内的案例卡（复用作品赏析的规格表样式） */
.unit:has(.case-item) .unit-body{--unit-cols:1fr}
.item.case-item{padding:0;overflow:hidden}

.case-item-body .work-fig{aspect-ratio:auto;height:100%;min-height:220px}

.case-item-inner .work-by{margin-top:0}

@media(max-width:760px){.case-item-body{grid-template-columns:1fr}.case-item-body .work-fig{aspect-ratio:3/2;min-height:0}}
.works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.work-card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--panel);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s,border-color .2s}

.work-card:hover .work-fig img{transform:scale(1.04)}
.work-genre{position:absolute;left:12px;top:12px;z-index:2;padding:4px 10px;border-radius:999px;

.work-body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1 1 auto}
.work-head{display:flex;align-items:baseline;gap:10px}
.work-num{font-family:var(--font-head);font-size:13px;color:var(--accent);font-weight:700}
.work-head h3{font-family:var(--font-head);font-size:19px;font-weight:600;color:var(--text-strong);margin:0}
.work-by{margin:6px 0 12px;font-size:12px;color:var(--faint);line-height:1.6}
.work-specs{margin:0 0 14px;display:grid;gap:7px}
.work-spec{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:start}
.work-spec dt{font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.02em;line-height:1.6}
.work-spec dd{margin:0;font-size:12.5px;line-height:1.75;color:var(--muted)}
.work-analysis{margin:0 0 16px;font-size:13.5px;line-height:1.95;color:var(--text);flex:1 1 auto}
.work-analysis b{color:var(--text-strong);font-weight:600}
.work-link{margin-top:auto;font-size:12.5px;color:var(--accent);border-top:1px solid var(--line);padding-top:12px;align-self:flex-start}
.theme-group{margin-bottom:44px}
.theme-group:last-child{margin-bottom:0}
.theme-head{display:flex;align-items:flex-start;gap:14px;margin:0 0 20px;padding:0 2px 14px;border-bottom:2px solid var(--line)}
.theme-num{font-family:var(--font-head);font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.theme-head h3{font-family:var(--font-head);font-size:clamp(19px,2.6vw,24px);font-weight:600;color:var(--text-strong);margin:0 0 5px}
.theme-head p{margin:0;font-size:13px;line-height:1.8;color:var(--muted);max-width:820px}
.works-note{max-width:820px;margin:22px auto 0;text-align:center;font-size:12.5px;color:var(--faint);line-height:1.8}
.sites-block{margin-top:56px;padding-top:40px;border-top:1px solid var(--line)}
.sites-title{text-align:center;font-family:var(--font-head);font-size:clamp(20px,3vw,27px);
  color:var(--text-strong);font-weight:600;margin:0 0 8px}
.sites-hint{text-align:center;color:var(--muted);font-size:13px;margin:0 0 26px}
.sites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.site-card{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--panel)}
.site-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.site-head a{font-family:var(--font-head);font-size:16px;font-weight:600;color:var(--accent)}
.site-badge{font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.site-badge.yes{background:var(--accent-soft);color:var(--accent-2)}
.site-badge.check{background:var(--line);color:var(--muted)}
.site-card p{margin:5px 0;font-size:12.5px;line-height:1.75;color:var(--muted)}
.site-card p b{color:var(--text);font-weight:600}
.site-card .site-note{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--faint)}
@media (max-width:760px){
  .works{margin-top:44px}
  .works-grid,.sites-grid{grid-template-columns:1fr}
  .work-analysis{font-size:14px}
  .theme-group{margin-bottom:34px}
  .theme-head{gap:10px}
  .theme-num{font-size:21px}
  .work-spec{grid-template-columns:72px 1fr;gap:6px}
}

/* ------------------------------- 打印 ------------------------------- */
@media print{
  .topbar,.toc,.mask,#toTop,.hero-actions,.read-btn,.theme-wrap,.search-wrap,.search-bar,.hero-credit{display:none !important}
  body{background:#fff;color:#000}
  .hero{min-height:auto;color:#000;background:#fff}
  .hero::after,.hero-img{display:none}
  .hero h1,.hero .subtitle,.hero .lede{color:#000;text-shadow:none}
  .unit[data-open="false"] .unit-body{display:grid !important}
  .chapter{page-break-inside:avoid;border-bottom:1px solid #ccc}
  a{color:#000;text-decoration:underline}
  .figure .ph{aspect-ratio:auto}
}

/* 学习路径下的练习台入口 */
.practice-banner{display:flex;align-items:center;gap:16px;max-width:1100px;margin:20px auto 0;
  padding:16px 22px;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r);background:var(--panel);text-decoration:none;transition:border-color .18s,transform .18s}
.practice-banner:hover{border-color:var(--accent);transform:translateY(-1px);text-decoration:none}
.pb-ico{font-size:22px;line-height:1;color:var(--accent);flex:0 0 auto}
.pb-txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto}
.pb-txt b{font-family:var(--font-head);font-size:15.5px;color:var(--text-strong);font-weight:600}
.pb-txt span{font-size:12.5px;line-height:1.75;color:var(--muted)}
.pb-go{font-size:12.5px;color:var(--accent);white-space:nowrap;flex:0 0 auto}
@media (max-width:760px){
  .practice-banner{margin:16px 14px 0;padding:14px 16px;gap:12px}
  .pb-go{display:none}
}

/* =========================================================================
   拾影 · 详情页专用样式
   复用 style.css 的主题变量（data-theme / data-dark），所有类名以 dt- 前缀
   避免与主页面组件冲突。
   ========================================================================= */

.dt-topbar{
  position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:10px;
  height:60px;padding:0 clamp(12px,2.4vw,30px);
  background:var(--bg);border-bottom:1px solid var(--line);
}
.dt-back{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
  padding:7px 10px;border-radius:var(--r-sm);white-space:nowrap}
.dt-back:hover{background:var(--panel-2);color:var(--accent);text-decoration:none}
.dt-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dt-crumb{flex:1;min-width:0;font-size:12.5px;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-crumb b{color:var(--muted);font-weight:600}
.dt-top-actions{display:flex;align-items:center;gap:6px}
.dt-nav-btn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);
  padding:7px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
.dt-nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);text-decoration:none}
.dt-nav-btn:disabled{opacity:.38;cursor:not-allowed}
.dt-nav-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.dt-layout{display:grid;grid-template-columns:288px minmax(0,1fr);max-width:1320px;margin:0 auto;
  align-items:start}
.dt-side{border-right:1px solid var(--line);padding:26px 18px 60px 22px;
  position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;
  scrollbar-width:thin}
.dt-side::-webkit-scrollbar{width:7px}
.dt-side::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px}
.dt-side-head{font-size:11px;letter-spacing:var(--label-ls);color:var(--faint);font-weight:700;
  text-transform:uppercase;margin:0 0 12px}
.dt-side-hint{font-size:11.5px;color:var(--faint);line-height:1.7;margin:0 0 18px}
.dt-ch{margin-bottom:14px}
.dt-ch-title{font-size:12.5px;font-weight:700;color:var(--text-strong);line-height:1.5;
  padding:4px 0;margin:0 0 4px}
.dt-sec-title{font-size:11px;color:var(--faint);padding:3px 0 3px 10px;line-height:1.5}
.dt-links{list-style:none;margin:0;padding:0 0 0 10px;display:grid;gap:2px}
.dt-links a{display:block;font-size:12px;line-height:1.6;color:var(--muted);
  padding:5px 9px;border-radius:7px;border-left:2px solid transparent}
.dt-links a:hover{background:var(--panel-2);color:var(--accent);text-decoration:none}
.dt-links a.is-current{background:var(--accent-soft);color:var(--accent-2);font-weight:700;
  border-left-color:var(--accent)}

.dt-main{min-width:0;padding:34px clamp(16px,4vw,54px) 90px;max-width:940px}
.dt-eyebrow{font-size:11px;letter-spacing:var(--label-ls);color:var(--accent);font-weight:700;
  text-transform:uppercase;margin:0 0 14px}
.dt-h1{font-size:clamp(25px,3.4vw,38px);line-height:1.4;letter-spacing:.01em;
  margin:0 0 18px;font-weight:700}
.dt-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 28px;padding-bottom:22px;
  border-bottom:1px solid var(--line)}
.dt-meta .dt-sec{font-size:12.5px;color:var(--faint)}
.dt-lead{font-size:17px;line-height:1.9;color:var(--text-strong);font-weight:600;
  padding:18px 22px;background:var(--panel);border-left:3px solid var(--accent);
  border-radius:0 var(--r) var(--r) 0;margin:0 0 30px}

.dt-block{margin:0 0 34px}

/* 详情页配图 */
.dt-fig{margin:0 0 32px}
.dt-fig-ph{position:relative;aspect-ratio:3/2;overflow:hidden;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r)}
.dt-fig-ph img{display:block;width:100%;height:100%;object-fit:cover}
.dt-fig figcaption{margin-top:9px;font-size:11.5px;line-height:1.6;color:var(--faint);text-align:right}
.dt-fig-credit{color:var(--faint);text-decoration:none;border-bottom:1px solid transparent;
  padding-bottom:1px;transition:color .16s,border-color .16s}
.dt-fig-credit:hover,.dt-fig-credit:focus-visible{color:var(--accent);border-bottom-color:currentColor}
.dt-fig.is-broken{display:none}
/* 银盐模板下配图统一转灰度，与版面气质一致 */
html[data-theme="mono"] .dt-fig-ph img{filter:grayscale(1) contrast(1.05)}
@media (max-width:560px){
  .dt-fig-ph{aspect-ratio:4/3}
  .dt-fig figcaption{text-align:left;font-size:11px}
}
.dt-h2{display:flex;align-items:center;gap:11px;font-size:20px;margin:0 0 16px;font-weight:700}
.dt-h2 .dt-no{display:inline-grid;place-items:center;width:28px;height:28px;flex:0 0 28px;
  border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;
  font-family:var(--font-body);font-weight:700}
.dt-p{font-size:15px;line-height:2;color:var(--text);margin:0 0 14px;text-align:justify}
.dt-p:last-child{margin-bottom:0}

.dt-steps{list-style:none;counter-reset:step;margin:0;padding:0;display:grid;gap:11px}
.dt-steps li{counter-increment:step;position:relative;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 18px 14px 56px;
  font-size:14.5px;line-height:1.85;color:var(--text)}
.dt-steps li::before{content:counter(step);position:absolute;left:16px;top:15px;
  width:25px;height:25px;display:grid;place-items:center;border-radius:7px;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12.5px;
  font-family:var(--font-body)}

.dt-mistakes{display:grid;gap:10px}
.dt-mistakes li{list-style:none;background:var(--panel-2);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:12px 17px;
  font-size:14.5px;line-height:1.85;color:var(--text)}
.dt-mistakes li::before{content:"✕";color:var(--accent);font-weight:700;margin-right:9px}

.dt-example{background:var(--panel);border:1px dashed var(--line-strong);border-radius:var(--r);
  padding:20px 24px}
.dt-example .dt-p{font-size:14.5px}

/* 案例：场景 / 怎么设 / 为什么 / 提醒 */
.dt-case-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;
  margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dt-case-grid>div{padding:15px 18px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.dt-case-grid>div:nth-child(2n){border-right:0}
.dt-case-grid> .is-why{grid-column:1/-1;border-right:0}
.dt-case-grid> .is-note{grid-column:1/-1;border-right:0;background:var(--panel-2);border-bottom:0}
.dt-case-grid dt{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--accent);
  margin:0 0 6px;text-transform:none}
.dt-case-grid dd{margin:0;font-size:14px;line-height:1.85;color:var(--text)}
.dt-case-grid> .is-note dd{color:var(--muted)}
@media (max-width:760px){
  .dt-case-grid{grid-template-columns:1fr}
  .dt-case-grid>div{border-right:0}
}

.dt-takeaway{display:flex;gap:14px;align-items:flex-start;background:var(--accent-soft);
  border-radius:var(--r);padding:19px 24px;margin:0 0 26px}
.dt-takeaway .dt-q{font-family:var(--font-head);font-size:34px;color:var(--accent);line-height:1}
.dt-takeaway p{font-size:15.5px;line-height:1.85;color:var(--text-strong);font-weight:600;margin:0}

.dt-kw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 40px}
.dt-kw span{font-size:11.5px;color:var(--faint);margin-right:3px}
.dt-kw em{font-style:normal;font-size:12px;color:var(--muted);background:var(--panel-2);
  border:1px solid var(--line);border-radius:999px;padding:4px 12px}

.dt-footnav{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:26px;
  border-top:1px solid var(--line)}
.dt-footnav a{display:block;padding:16px 20px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);text-decoration:none;transition:.18s}
.dt-footnav a:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-2px);
  box-shadow:var(--shadow-sm)}
.dt-footnav .dt-fn-k{display:block;font-size:11px;color:var(--faint);letter-spacing:.1em;margin-bottom:6px}
.dt-footnav .dt-fn-t{display:block;font-size:14px;font-weight:600;color:var(--text-strong);line-height:1.55}
.dt-footnav .dt-next{text-align:right}
.dt-footnav .dt-disabled{opacity:.35;pointer-events:none}

.dt-totop{position:fixed;right:22px;bottom:24px;z-index:200;width:44px;height:44px;
  border-radius:50%;background:var(--panel);border:1px solid var(--line-strong);
  box-shadow:var(--shadow-sm);display:grid;place-items:center;opacity:0;visibility:hidden;
  transition:.22s}
.dt-totop.show{opacity:1;visibility:visible}
.dt-totop:hover{border-color:var(--accent)}
.dt-totop svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

.dt-notfound{text-align:center;padding:110px 20px;color:var(--muted)}
.dt-notfound h1{font-size:26px;margin-bottom:14px}
.dt-notfound p{font-size:14px;margin-bottom:22px}

.dt-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:290}

/* 主题菜单（复用主页面结构，独立定位） */
.dt-topbar .theme-wrap{margin-left:0}

@media (max-width:1000px){
  .dt-layout{grid-template-columns:1fr}
  .dt-side{position:fixed;left:0;top:60px;bottom:0;width:300px;height:auto;z-index:295;
    background:var(--bg);transform:translateX(-101%);transition:transform .24s ease;
    box-shadow:var(--shadow)}
  .dt-side.open{transform:none}
  .dt-crumb{font-size:11.5px}
  .dt-side-toggle{display:inline-flex}
}
@media (min-width:1001px){ .dt-side-toggle{display:none} }
@media (max-width:560px){
  .dt-nav-btn span{display:none}
  .dt-back span{display:none}
  .dt-main{padding:24px 16px 70px}
  .dt-footnav{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .dt-layout *,.dt-topbar *{transition:none !important}
}

/* 详解页底部：通往模拟器的引导条 */
.dt-tooltip{max-width:760px;margin:26px auto 0;padding:14px 18px;border:1px dashed var(--line);
  border-radius:var(--r);font-size:13px;line-height:1.8;color:var(--muted);background:var(--panel-2)}
.dt-tooltip a{color:var(--accent);text-decoration:underline}

</style>

<script>
var DETAILS=[{"id":"1-1-1","title":"1.1.1 一张照片里藏着光、时间和选择","tag":"理论","section":"1.1 照片是光留下的痕迹","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"同一束光，为什么有人拍出了故事，有人只留下一条干巴巴的记录？答案不在器材，而在照片里同时存在的三样东西：光、时间，还有你按快门前做的选择。看懂了这三样，你就摸到了摄影最底层的门道。","principle":"光是摄影的颜料。明暗、质感、色彩倾向都由它决定：清晨斜射的光带着暖意，把轮廓勾得柔和，正午顶下来的光却硬得发白，几乎是把同一个场景变成两个故事。所以读懂光从哪来、是软是硬、什么色温，是观看的第一步——没有光就没有照片，光一换，画面就跟着换。\n时间是照片的底片。快门开合的那一刹那，人物的神态、云影的位置、水面的波纹被一起定住，之后再也不会一模一样，哪怕重拍一百次也凑不回同样的一帧。正因为这样，每张照片都不可复制，也都带着那个瞬间独有的分量。\n选择是摄影的语法。站在哪里、框里留谁、什么时候按下去，这三个决定把同一个场景变成“你的”照片——位置差一步、时机差半秒，结果就南辕北辙。想明白这一层，你就从被动的记录者，往主动的表达者那边挪了一小步。","steps":["观察光位：绕主体慢慢走一圈，分别在正面、侧面和背面停下来，比较阴影的方向、长短和质感的软硬差别，感受光位一变，画面气质怎么跟着变（光位角 0°/45°/90°，各停 30 秒）。","锁定时间切片：按住连拍，从中挑神态或云影最动人的那一帧，回头和前后几张比一比，体会那半秒的差别为什么无法重来（连拍 3–5 张，间隔 1 秒）。","做三个选择：先花几秒定站位，再决定框里留谁、舍谁，最后盯着画面等那个最合适的时机再按，一步步把选择握回自己手里（机位 2–3 个 / 主体 1 个）。","回看自问：回放一遍，盯着画面停十秒，问自己：这里面有我在意的光，有不可重来的那一刻，也有我主动做出的选择吗？（回放 1 遍，停 10 秒）。"],"mistakes":["只盯着拍到了什么，不看光从哪来、是软是硬，拍出来的画面容易发平，缺了立体和氛围。先看光再拍，画面才有层次。","以为按下快门就算完成，不做事先的取舍，结果主体被杂乱的背景淹没，看的人不知道先看哪儿。按之前先定主体，再清一圈边缘。","反复站在同一个机位按快门，把多拍误当成有选择，其实只是机械重复。真换一换位置和角度，才谈得上在选择。"],"example":"傍晚的街角，同一盏路灯下，两个人拍出来的却是两种结果：有人抬手就拍，行人只是匆匆路过，留不下任何记忆点；有人却肯多等一会儿，等到一位撑伞的人不紧不慢地走进那团暖黄的光斑，才按下快门。后一张里，光、时间和选择刚好凑齐——光给了氛围，时机给了巧合，等待给了选择，那位原本普通的路人，也就成了故事里唯一的主角。","case":null,"takeaway":"先看清光、时间和你的选择，再去谈参数：一张照片说到底，就是这三样凑成的。","keywords":["光","时间","选择","观察","表达"],"photo":{"alt":"阳光从树林间斜射下来，一道道光柱落在满地落叶上","id":14030654,"page":"https://www.pexels.com/photo/rays-of-sunlight-passing-through-forest-trees-14030654/","ph":"Vladimir Srajber","src":"https://images.pexels.com/photos/14030654/pexels-photo-14030654.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/14030654/pexels-photo-14030654.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/14030654/pexels-photo-14030654.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Rays of Sunlight Passing Through Forest Trees"}},{"id":"1-1-2","title":"1.1.2 快门按下的那一刻，发生了什么","tag":"理论","section":"1.1 照片是光留下的痕迹","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"快门按下去的那一下，相机里其实发生了一场看不见的接力：光穿进镜头，落在传感器上，变成电信号，最后才被算成一张照片。搞懂这条链条，你以后调参数就有据可依了。","principle":"镜头把景物投射到传感器上，很像投影仪把画面打到幕布上，只不过光是从外面“画”进来。光圈就是这扇窗的大小：开得越大，进来的光越充足，画面越亮，背景也越容易虚；开小了，光就少了，前后却更清楚。\n传感器才是真正的“底片”，上面密密麻麻排着数百万个感光单元，每个单元按收到的光强弱给出不同的电信号，光强的地方信号大，光弱的地方信号小。光电转换这一步，是摄影从光学走向数字的关键，也决定了照片最终的信息从哪来。\n快门决定传感器“见光”的时间：开得久，画就画得久，运动的东西容易拖影；开得短，瞬间被冻住，代价是进光也少了。零件不必全记住，只要明白照片是被记录下来的光就够了，剩下的细节用到再补。","steps":["看光圈：固定同一处景物，分别用 f/2.8 和 f/8 各拍一张，比较画面亮度和背景虚化程度差了多少，确认光圈同时管着进光与景深（f/2.8 与 f/8 各拍 1 张）。","看快门：对准同一个运动中的物体，用 1/60s 和 1/500s 各拍一张，看一张拖出残影、一张把动作冻住，体会快门长短对“时间”的取舍（1/60s 与 1/500s 各拍 1 张）。","看 ISO：在同样的弱光下用 ISO 100 和 ISO 1600 各拍一张，比一比亮度和噪点，明白传感器“放大信号”是要付出画质代价的（ISO 100 与 ISO 1600 各拍 1 张）。","连成链条：把光圈、快门、ISO 各调一次，观察曝光随之怎么变，确认这三个旋钮是一起决定一张照片有多亮的（光圈+快门+ISO 各调 1 次）。"],"mistakes":["把按快门理解成按一下按钮，忘了背后光被记录、被转换的整个过程，出了问题自然无从查起。把这条链条理清，才知道该动哪个旋钮。","把光圈、快门、ISO 分开死记，却不知道它们共同定下一张照片的亮度，调了一个忘了补另一个，画面不是过曝就是发暗。","一味开大光圈追虚化，却不顾进光太多，把画面拍得过曝，亮部细节全糊成一片。大光圈要有对应更快的快门或更低的 ISO 来配合。"],"example":"拍一杯冒热气的茶，就能把这根链条看明白：用 f/2.8、1/250s 时，背景化成一块柔和的色，杯口的热气被冻在半空，纹丝不动；换成 f/8、1/60s，环境一下子清楚了，热气却拖成一团缓缓上升的雾。同一杯茶，光被记录的方式不同，讲出来的话也不同——前者干净利落，后者温柔绵长。","case":null,"takeaway":"镜头投射、传感器转换、快门计时——照片说到底，就是被记录下来的那束光。","keywords":["快门","光圈","传感器","曝光","光电转换"],"photo":{"alt":"清晨的树林里，光线穿过枝叶散成放射状的光束","id":38921470,"page":"https://www.pexels.com/photo/sunlit-forest-with-light-rays-through-trees-38921470/","ph":"Sevde Altintas","src":"https://images.pexels.com/photos/38921470/pexels-photo-38921470.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/38921470/pexels-photo-38921470.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/38921470/pexels-photo-38921470.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Sunlit Forest with Light Rays Through Trees"}},{"id":"1-1-3","title":"1.1.3 摄影与绘画、记忆、记录的关系","tag":"提示","section":"1.1 照片是光留下的痕迹","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"摄影到底是什么？说它是证据也行，说它是记忆的锚点也行，可它其实从来不是纯粹的任何一种——它稳稳站在艺术和记录的交叉口上，两边各借一点。","principle":"绘画可以把不存在的场景画出来，摄影却只能从眼前真实存在的光里取材，没有光、没有在场，就拍不出来。这份“必须在场”的限制，反倒让照片天生带着证据般的可信感——我们总愿意相信“照片里真发生过”。\n照片又像记忆的锚点。多年后翻到一张旧照片，那个下午的温度、气味和心情会被一并叫醒，甚至能想起当时自己站在哪个位置，这是文字和描述都替不了的。\n所以摄影介于记录与艺术之间：它忠实记下真实，又通过取景、时机和光线说出你的感受。想明白这双重身份，你就不必在“要真实”和“要好看”之间来回摇摆——两张其实可以同时做到，真实是底子，好看是说出来的话。","steps":["找证据感：找一个正在发生的真实场景，什么也不摆布、不引导，就让它自然发生，体会那份“必须在场、不容伪造”的可信力量（真实现场 1 处，不做摆布）。","找记忆锚：翻出一张三年前的旧照，盯着看半分钟，记下它叫醒了什么情绪、什么气味、什么细节，感受照片如何成了记忆的锚点（翻看 3 年前旧照 1 张，停 30 秒）。","找表达：站在同一个场景，用两种完全不同的取景各拍一张，回头比一比，哪一版更像你想说的那句话（同一场景拍 2 种取景）。","定坐标：用一句话给自己定个坐标：这张更偏记录，还是更偏表达？想清楚这一点，下次拍就知道往哪边再挪一步（自评 1 句：记录多还是表达多）。"],"mistakes":["把真实当成摄影的全部，以为原样记录就够了，忘了取景、时机和光线也在替你说感受，结果照片只有信息没有态度。","后期一味追求像画，过度涂抹，反而丢掉了照片“在场”的那份证据力量，让可信感打了折扣。","以为照片一定能唤起记忆，可画面平淡、没有落点时，它其实什么也留不住——记忆的锚，得先扎进一个具体动人的瞬间里。"],"example":"同样是拍一条老街：一张平铺直叙地记下门牌、摊位和来往的人，信息齐全，是一份忠实的证据；另一张却肯等，一直等到一位老人推着车缓缓走进那片斜射的阳光里，才按下快门。两张都真实、都在场，可后一张多了一层温度，也多了一句想说的话——它既记录了这条街，也讲出了这条街的黄昏。","case":null,"takeaway":"摄影 = 记录真实 × 表达感受：既忠实记下真实，又借取景与时机说出感受，两样都在，才是它真正独特的地方。","keywords":["记录","艺术","记忆","证据","在场"],"photo":{"alt":"林间透下的阳光照亮苔藓与树根，像一幅自然写生","id":28883308,"page":"https://www.pexels.com/photo/sunlight-streaming-through-forest-trees-28883308/","ph":"Mladen Janic","src":"https://images.pexels.com/photos/28883308/pexels-photo-28883308.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/28883308/pexels-photo-28883308.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/28883308/pexels-photo-28883308.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Sunlight Streaming Through Forest Trees"}},{"id":"1-2-1","title":"1.2.1 从“拍下来”到“拍出感受”","tag":"提示","section":"1.2 为什么拍：从记录到表达","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"照片拍得清楚、信息齐全，就算拍好了吗？这只能算及格。再往前一步，是让看这张照片的人心里动一下、愿意多留一会儿，那才是从记录迈向了表达。","principle":"刚拿起相机时，我们常想着“把这个东西拍下来”：主体清楚、信息齐全就满意了。这是记录的阶段，没错，也是必要的底子，但它只是起点，不是终点。\n往前一步，可以先问自己：这张照片想让看的人产生什么感觉？安静、热闹、孤独，还是温暖？这个答案会反过来告诉你该挑什么光、站什么角度、等什么时机，把技术都收拢到情绪上。\n当你围着这份感受去安排画面，照片就从记录走进了表达。同一棵树，正午拍下来只是资料，薄雾里拍出来就成了情绪。感受就是那个指南针，方向定了，剩下的是走哪条路。","steps":["定一个情绪词：按快门前先在脑子里定一个情绪词，把它当成整张照片的目标，后面挑光、选角度、等时机都围着它转（安静/热闹/孤独/温暖 中选 1 个）。","配光：让光的软硬和色温对上情绪：暖光配温暖，冷雾配孤独，硬光配紧张，别让光说一套、情绪说另一套（柔光/硬光/逆光 选 1 种）。","取角度：平视、俯拍、仰拍各试一次，回看哪一张最能把这份情绪顶上去，就留哪一张（平视/俯拍/仰拍 各试 1 次）。","验感受：把照片给一位朋友看三秒，问他第一眼感受到什么，再跟你的目标比一比，看情绪有没有传到位（给 1 位朋友看 3 秒）。"],"mistakes":["只求拍全，把画面信息塞得满满当当，却没有一个情绪落点，看的人反而不知道该往哪儿看、该被什么打动。","先拍完再回头想感受，光和角度都没为情绪服务，照片自然平平。情绪得在按快门前定，才来得及指挥画面。","一张照片想同时塞进三四种情绪，结果哪种都不突出，全糊在一起。一张照片，把一种情绪说透就够了。"],"example":"想拍“孤独”，就等清晨的薄雾，借低角度的侧光，画面里只留一个人影和一道被拉得老长的影子，四周空荡荡；想拍“热闹”，就换成正午的街市，用逆光打出一片熙攘的人群，热气腾腾。情绪先定下来，光、角度和时机自然就跟着走了，完全不用手忙脚乱地找感觉。","case":null,"takeaway":"先定感受，再挑光和角度；从“拍下来”到“拍出感受”，其实只差按快门前那一句提问。","keywords":["感受","情绪","表达","取舍","指南针"],"photo":{"alt":"一双手举着相机取景，镜头对着画外正在发生的事情","id":19911809,"page":"https://www.pexels.com/photo/hand-holding-camera-and-taking-pictures-19911809/","ph":"FranDany","src":"https://images.pexels.com/photos/19911809/pexels-photo-19911809.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/19911809/pexels-photo-19911809.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/19911809/pexels-photo-19911809.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Hand Holding Camera and Taking Pictures"}},{"id":"1-2-2","title":"1.2.2 摄影如何改变我们看世界的方式","tag":"理论","section":"1.2 为什么拍：从记录到表达","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"学摄影之后，很多人会发现自己开始“看见”以前根本注意不到的东西——墙上的影子、天空的变色、路人的表情。这不是错觉，是注意力被悄悄改写了。","principle":"你会留意光落在墙上的形状、傍晚天空一层层换掉的颜色、陌生人脸上一个耐人寻味的表情。这些细节其实一直都在，只是从前没进过脑子，也没人教过你怎么去注意它们。\n摄影像一副“注意力眼镜”，把“看”从被动的接收变成主动的搜寻。你会开始判断：这束光值不值得等，这个人的表情值不值得按，这个画面凑不凑得齐。慢慢就养出了在平常场景里认出好瞬间的本事。\n这种看法的改变，常常比照片本身更值钱。哪怕哪天不拍了，走在同一条路上，你依然是个更会观察生活的人，比从前多了双能发现好看瞬间的眼睛。","steps":["光影扫描：每天找一束光落在墙面或地上的形状，停下来观察一分钟，顺手记下它出现的时间，慢慢摸清光在一天里的节奏（每天 1 处，观察 1 分钟）。","颜色日记：连续三天在差不多的时间拍同一片天空，把三张摆在一起，比一比颜色和光线每一天差在哪（连续 3 天，拍同一片天）。","表情速写：在公共场合留意路人的神态，每天抓一个打动你的瞬间拍下来，练的是对表情的瞬间判断力（每天 1 张，抓 1 个瞬间）。","复盘：每周把七张回看一遍，标出最满意的那张，想一想自己到底偏爱哪种光、哪种神态，摸出自己的观察口味（每周回看 7 张）。"],"mistakes":["带着相机才肯观察，一放下相机就回到视而不见，观察成了任务而不是习惯。真正的观察力，是不带相机也一直在看的。","把“看见”等同于“拍照”，总急着按下快门，忘了观察本身就是收获，有时候停下来看半分钟，比拍十张更有价值。","只盯着宏大场面，一心等“大片”，反而错过身边细微的光影变化，那些最日常、最动人的瞬间都被略过了。"],"example":"以前下班走同一条路，从没抬过头，也从不记得路上有什么；学摄影后的某个下午，你忽然注意到五点的阳光把栏杆的影子投在墙上，一格一格，整整齐齐，像一排琴键。你不由自主地站住，看了半分钟，心里已经在想该怎么把它拍下来。路还是那条路，可看路的你，已经变了。","case":null,"takeaway":"摄影真正练的是注意力；会看这件事，比会拍更长久，也更能陪你一辈子。","keywords":["注意力","观察","光影","日常","敏感"],"photo":{"alt":"摄影师举机取景，透过镜头观察眼前的世界","id":8114231,"page":"https://www.pexels.com/photo/photographer-taking-photo-with-camera-8114231/","ph":"Annushka Ahuja","src":"https://images.pexels.com/photos/8114231/pexels-photo-8114231.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/8114231/pexels-photo-8114231.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/8114231/pexels-photo-8114231.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Photographer Taking Photo with Camera"}},{"id":"1-2-3","title":"1.2.3 好照片的朴素标准：清楚、动人、有话说","tag":"提示","section":"1.2 为什么拍：从记录到表达","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"不必迷信那些复杂的构图规则，记了一堆口诀反而不会拍。入门阶段，三个朴素标准就足够你拿来当一张照片的自检清单。","principle":"清楚——主体清楚，让人一眼就知道你在拍什么。清楚不等于整张照片都得锐利，而是注意力有个明确的落点，眼睛一进画面就知道该看哪儿，别的东西都退到后面。\n动人——能让看的人起一点共鸣，哪怕只是一瞬的心动，或者一个会心的笑。动人来自情绪的真实，而不是技巧堆得多，堆出来的往往显得用力过猛。\n有话说——画面里藏着一个值得讲的小故事，让人愿意多看两眼。三条不必每次都占全，占两条就够好，但拿它们当练习时的自检清单，比死记一堆规则实用得多，练起来也有方向。","steps":["查清楚：把照片给人看三秒，然后问“拍的是什么”；对方答不上来，多半就是主体不够清楚，该回去重拍（3 秒辨认测试）。","查动人：诚实问自己一句：看这张的人，会不会有那么一点心动或者感触？说不出具体感觉，就先别急着交卷（1 句共鸣自评）。","查有话说：试着用一句话讲出画面背后那个小故事，讲得出来，说明这张照片有内容；讲不出来，它就还只是一张漂亮的记录（1 句话讲故事）。","打分：三项各记 0 或 1 分，凑不满 2 分就说明还欠火候，回去重拍一张，别舍不得删（每项 0/1，满分 3 分）。"],"mistakes":["把“清楚”理解成整张都得锐利，前后全拍实，结果画面没了重点，注意力反而被摊薄。清楚是主体有落点，不是处处都实。","只顾技术正确，参数漂亮、构图工整，却把情感共鸣这一维忘了，照片“对”是“对”了，就是不动人。","一次想同时满足三条，反而把自己捆得不敢按快门。三条是自检清单，不是枷锁，先拍下来再回头打分。"],"example":"一张街头照片，三条都能对上号：主体是躲在屋檐下避雨的人，一眼看得明白，是“清楚”；你看了心里微微一酸，是“动人”；画面里潮湿的地面和空着的手，暗示刚下过一场雨、他手里没伞，是“有话说”。三条都沾上一点，就已经是一张耐看的好照片，比堆满技巧的空壳强得多。","case":null,"takeaway":"清楚、动人、有话说——拿这三条当尺子自检，比死记一堆规则管用多了。","keywords":["清楚","动人","有话说","自检","共鸣"],"photo":{"alt":"一位摄影师专注地端着相机，在按快门前片刻停顿","id":5709600,"page":"https://www.pexels.com/photo/asian-photographer-taking-picture-on-photo-camera-5709600/","ph":"Sam Lion","src":"https://images.pexels.com/photos/5709600/pexels-photo-5709600.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/5709600/pexels-photo-5709600.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/5709600/pexels-photo-5709600.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Asian photographer taking picture on photo camera"}},{"id":"1-3-1","title":"1.3.1 新手常见的三种拍摄状态","tag":"提示","section":"1.3 从随手拍到有意识拍摄","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"看到就拍、等好场景、只信自动档——这三种状态都很正常，谁也别急着自责，要紧的只是往里面加一点主动选择，把它们一个个掰过来。","principle":"第一种是“看到就拍”，密度高，缺取舍，回来一翻一堆相似的照片，翻都翻不完。问题不在拍得多，而在没想过为什么要按这一下，只是手指比眼睛快。\n第二种是“等好场景”，总想碰上完美画面才出手，结果常常是等来的不是完美，是错过；或者只在“像明信片”时才满意，看不见平凡日常里的美。\n第三种是“只信自动档”，全交给相机决定，稳妥是稳妥，可也把表达权让了出去，拍什么、怎么拍都跟你的想法无关。三种之间，需要插进一点主动选择——取什么、舍什么、为什么偏偏是这一刻值得按。","steps":["识别状态：回看最近二十张，把它们归进这三种状态，看看自己最常落在哪一种，那就是接下来最该改的入口（回看 20 张，归类 3 种）。","为看到就拍加取舍：同一个场景只留一张，逼自己当场做出取舍，删到只剩最想保留的那一张为止（每场景只留 1 张）。","为等场景设限：每天只交一张，而且要逼自己在三十秒内按下快门，治一治“非要完美才拍”的毛病（每天 1 张，30 秒内出手）。","为自动档加一步：每次拍摄前，先从曝光补偿或者取景这一项开始自己调，一点点把控制权从相机手里拿回来（每次先调 1 项）。"],"mistakes":["以为拍得多就是练习，从不回看也不取舍，结果只是在重复同一个错误，数量堆上去了，水平没动。","非完美场景就不肯拍，等来等去，手感越来越生疏，真正的好机会也一个接一个从眼前溜走。","永远挂在自动档，碰上复杂光线就束手无策，因为从来没自己做过决定，自然不知道该往哪边调。"],"example":"同样一条街，三种人三种结果：“看到就拍”的人一口气拍了 50 张，回家一张都舍不得删；“等好场景”的人站了半天，嫌光线不够完美，结果一张也没按；成熟一点的做法是拍 5 张，当场挑出 1 张，还能说清楚为什么是它、下一回想改哪里。差别不在设备，全在有没有那一点主动选择。","case":null,"takeaway":"三种状态都正常，不必自责；真正进步的关键，是在它们中间加进一句主动的选择。","keywords":["新手","取舍","自动档","主动选择","回看"],"photo":{"alt":"少年在户外低头摆弄相机，第一次学摄影的样子","id":35154384,"page":"https://www.pexels.com/photo/young-boy-learning-photography-outdoors-35154384/","ph":"Afterglow Street","src":"https://images.pexels.com/photos/35154384/pexels-photo-35154384.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/35154384/pexels-photo-35154384.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/35154384/pexels-photo-35154384.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Young Boy Learning Photography Outdoors"}},{"id":"1-3-2","title":"1.3.2 按快门前可以先想的三件事","tag":"实操","section":"1.3 从随手拍到有意识拍摄","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"只要几秒钟的停顿，那些随手一拍的画面就能变成有目的的照片。三件事，按快门前先在脑子里过一遍，成本极低，收益却很大。","principle":"第一问：主体是谁，我想把注意力引到哪里？主体一明确，画面就有了秩序，别人一眼就知道该看哪儿；主体含糊，再好的光线也救不回来。所以举起相机前，先在心里点出那个人、那朵花或那件物，让它成为全画的主角。\n第二问：背景里有没有跟主体抢戏的东西？一根斜插进来的树枝、一块亮眼的路牌，都可能悄悄把观者的眼睛带走，所以按快门前先扫一圈边缘，把多余的移走或者避开。背景干净了，主体才站得出来。\n第三问：这张照片我想表达什么情绪？安静、热闹还是温暖，先有个大概方向，光和时机才有服务的对象。三问加起来不过几秒，却完成了从记录到表达的跨越，也是从量变走向质变最省力的习惯，练熟之后几乎不用刻意去想。","steps":["问主体：按快门前花三秒定下注意力的落点，就一个主体，别贪多，主体一多画面就散（锁定 1 个主体，3 秒）。","清背景：扫一圈画面边缘，把抢戏的元素挪走，挪不动的就换个机位避开，别让它们分散注意力（扫视画面边缘 1 圈）。","定情绪：花两秒定一个情绪词，让光和时机都为它服务，觉得到位了，再按下去（选 1 个情绪词，2 秒）。"],"mistakes":["三件事只想一件就急着按，结果主体和背景经常打架，注意力被扯来扯去。三问要连着一块过，才来得及协调。","清背景清过了头，把有用的环境信息也一起清没了，照片变得干巴巴，少了那份“在哪儿”的现场感。","在情绪词上纠结太久，等你想明白，那个瞬间早就过去了。情绪定个大概方向就行，别追求精确到字。"],"example":"拍朋友在咖啡馆：先锁定她，把她当唯一的主体；再把桌上杂乱的杯子悄悄挪开，清掉背景里的干扰；最后耐心等她笑出来的那一下，才按下快门。三秒钟的思考，换来一张有目的的照片，回看时你会清楚记得自己当时在想什么，而不是碰运气。","case":{"scene":"傍晚六点的面馆，一盏暖黄的吊灯照着一位低头吃面的老人，热气从碗里缓缓升起，四周再没别的客人。","setup":"先锁定老人为主体，再扫一圈画面边缘，把桌角那只碍眼的塑料袋悄悄挪走，心里默默定下“安静”二字，然后等他抬头的那个瞬间再按。","why":"主体决定注意力落在哪儿，定住老人，画面就有了秩序；清掉塑料袋这类抢戏的干扰，视线才不会飘走；先在心里定下“安静”，光线和时机才会为它服务，拍出来才不散。","note":"三件只想一件就急着按快门，最容易翻车——宁可多停两秒，也别漏掉另外两问。"},"takeaway":"主体、背景、情绪——按快门前花几秒想这三件事，随手一拍就成了有目的、有分寸的用心一拍。","keywords":["主体","背景","情绪","三问","停顿"],"photo":{"alt":"徒步者在林间停下脚步，先看再举机、最后才按快门","id":17751982,"page":"https://www.pexels.com/photo/boy-hiking-in-the-forest-and-using-a-camera-17751982/","ph":"Hanuman Photo Studio","src":"https://images.pexels.com/photos/17751982/pexels-photo-17751982.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/17751982/pexels-photo-17751982.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/17751982/pexels-photo-17751982.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Boy Hiking in the Forest and Using a Camera"}},{"id":"1-3-3","title":"1.3.3 入门学习路径：先懂原理，再练手感","tag":"提示","section":"1.3 从随手拍到有意识拍摄","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"原理像地图，手感像脚力。入门阶段先把地图拿在手里，知道光、曝光、对焦、构图各管什么，后面每走一步都会省力得多，也不容易在黑暗里乱撞迷路。","principle":"建议的顺序是：先把光、曝光、对焦、构图这几样基本原理弄懂，再用大量拍摄一点点把手感练出来。顺序颠倒也能成，只是会多绕些路，多拍一些自己也说不清为什么的废片。\n原理能解释“为什么会糊、为什么会过曝”，让你知道问题卡在哪一环；没有原理，练习基本是在碰运气，错了也不知道错在哪，下次照旧。\n手感则让你在真实场景里迅速做对取舍，把知识变成本能。两者像地图和脚力，缺一不可；只是入门阶段先有地图，才不会在黑暗里乱走，也才有底气放开手脚去练。","steps":["学原理：每个主题先读一篇讲原理的文章，再动手做一次小实验，把文字变成自己的理解（4 个主题：光/曝光/对焦/构图）。","做验证：每组参数拍三张做对比，用实拍亲手证明原理，别停在死记硬背上（每组参数拍 3 张对比）。","练手感：每天在真实场景里拍十张，连续三十天，逼自己快速取舍，把判断练成肌肉记忆（每天 10 张，连续 30 天）。","复盘迭代：每周回看一次，用学过的原理去解释这次哪里没拍好，再回到下一次拍摄里修正，形成一个闭环（每周回看 1 次）。"],"mistakes":["只看书不拍，原理停在纸上，始终内化不了。原理得靠实拍验证一遍，才算真正成了你的东西。","只拍不学，同样的错犯了一遍又一遍，却始终不知道错在哪儿。不补原理，拍得再多也只是原地打转。","四个原理一起上，贪多求快，结果哪个都没吃透，样样都懂一点、样样都不扎实。一次吃透一个，反而快。"],"example":"先搞懂“安全快门≈1÷焦距”这句话，再拿一支 50mm 镜头，分别用 1/60s 和 1/15s 各拍一组，亲手看见糊和不糊到底差在哪、临界点大概在哪。原理被实拍验证过这么一次，才算真正成了你自己的手感，下次举机心里就有数了。","case":null,"takeaway":"先懂原理，再练手感；原理是地图，手感是脚力，两者缺一不可，先有地图走起来才不绕路。","keywords":["原理","手感","学习路径","验证","复盘"],"photo":{"alt":"户外摄影工作坊里，几个人围着讲师学相机操作","id":33617350,"page":"https://www.pexels.com/photo/photography-workshop-in-costa-rica-outdoors-33617350/","ph":"Warner Brenes Quesada","src":"https://images.pexels.com/photos/33617350/pexels-photo-33617350.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/33617350/pexels-photo-33617350.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/33617350/pexels-photo-33617350.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Photography Workshop in Costa Rica Outdoors"}},{"id":"1-4-1","title":"1.4.1 林间光柱","tag":"实操","section":"1.4 风光与光影","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"清晨的树林里，光比与雾气决定了照片的成败。这一例看摄影师如何先找光的方向，再决定站到哪里按快门。","principle":"拍摄场景：清晨或傍晚的落叶林，空气里有薄雾或浮尘，阳光从树冠缝隙斜切进来。\n光线条件：低角度直射阳光被树冠切成一束束；雾气让光路产生丁达尔效应，亮处与暗处反差很大。\n差异点：同主题另两例把地景当主体（雪山、天空），是「面」的风光；这一例直接把光当主体，拍的是「线」与「体积」，看点在于光路而非地标。","steps":["主体：穿过枝叶的光柱本身，以及被光柱照亮的林间地面与落叶。","构图：压低机位，让光柱从画面上方斜穿到下方，形成一条天然引导线，把视线引向林子深处；不放人物，全靠明暗层次撑起画面。","参考参数与器材：参考：三脚架稳住；f/8–f/11 保住光柱边缘与落叶细节；ISO 100；对焦在光柱落点附近；点测光对准亮部再略减曝光，避免高光溢出。"],"mistakes":["把参考参数当成固定答案：参考：三脚架稳住；f/8–f/11 保住光柱边缘与落叶细节；ISO 100；对焦在光柱落点附近；点测光对准亮部再略减曝光，避免高光溢出。是把判断落到相机的起点，换了光线和场景就要重新试拍。","照搬构图却丢掉取舍：压低机位，让光柱从画面上方斜穿到下方，形成一条天然引导线，把视线引向林子深处；不放人物，全靠明暗层次撑起画面。的重点是让视线有去处，不是把每样东西都塞进画面。","忽略与同主题另两例的差别：同主题另两例把地景当主体（雪山、天空），是「面」的风光；这一例直接把光当主体，拍的是「线」与「体积」，看点在于光路而非地标。"],"example":"画面最抓人的是斜着切进树林的光柱：树冠的缝隙把阳光筛成一道道清晰的光带，落在满地落叶上，亮处与暗处拉开很大的反差。摄影师把机位压低，让光柱从画面上方斜穿到下方，形成一条天然的引导线，视线跟着光一直走到林子深处。落叶铺满地面，颜色偏暖黄，和四周偏冷的阴影形成冷暖对比。光柱边缘有细微的雾气散射，说明空气里有水汽或浮尘，这正是丁达尔效应能被拍下来的前提。整张照片没有人物，却让人感到清晨的安静——它教会初学者：先找到光的方向，再决定站在哪里按快门。","case":{"scene":"清晨或傍晚的落叶林，空气里有薄雾或浮尘，阳光从树冠缝隙斜切进来。","setup":"参考：三脚架稳住；f/8–f/11 保住光柱边缘与落叶细节；ISO 100；对焦在光柱落点附近；点测光对准亮部再略减曝光，避免高光溢出。","why":"压低机位，让光柱从画面上方斜穿到下方，形成一条天然引导线，把视线引向林子深处；不放人物，全靠明暗层次撑起画面。 低角度直射阳光被树冠切成一束束；雾气让光路产生丁达尔效应，亮处与暗处反差很大。","note":"同主题另两例把地景当主体（雪山、天空），是「面」的风光；这一例直接把光当主体，拍的是「线」与「体积」，看点在于光路而非地标。"},"takeaway":"拍「林间光柱」这一类画面，先按「压低机位，让光柱从画面上方斜穿到下方，形成一条天然引导线，把视线引向……」定下取舍，再照「低角度直射阳光被树冠切成一束束；雾气让光路产生丁达尔效应，亮……」调曝光；参数只是把判断落实的工具。","keywords":["风光","光影","风光与光影","林间光柱"],"photo":{"alt":"阳光从树林间斜射下来，一道道光柱落在满地落叶上","id":14030654,"page":"https://www.pexels.com/photo/rays-of-sunlight-passing-through-forest-trees-14030654/","ph":"Vladimir Srajber","src":"https://images.pexels.com/photos/14030654/pexels-photo-14030654.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/14030654/pexels-photo-14030654.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/14030654/pexels-photo-14030654.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Rays of Sunlight Passing Through Forest Trees"}},{"id":"1-4-2","title":"1.4.2 马特洪峰日出倒影","tag":"实操","section":"1.4 风光与光影","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"雪山加倒影是风光里最经典的高光比难题。这一例看怎样把天与地都收进动态范围，又保住水面的对称。","principle":"拍摄场景：高山湖畔，日出前后，雪山与湖面倒影同框，岸边有几块作前景的石头。\n光线条件：日出低角度侧光，雪面受光面与背光面明暗反差极大，天空从暖橙过渡到冷蓝。\n差异点：和林间光柱比，这里光只负责「染色」，不动构图；和日落天空比，它有明确地标与前景倒影，不是纯色块。","steps":["主体：被朝阳染亮的雪峰，以及平静湖面里近乎对称的倒影。","构图：水平线放在画面中部偏下，山体与倒影上下呼应；前景岸石压住下缘，把二维的画面拉出纵深。","参考参数与器材：参考：广角到中焦；f/8–f/11 保证全景深；ISO 100；三脚架配渐变灰镜平衡天地大光比；对焦在超焦距附近。"],"mistakes":["把参考参数当成固定答案：参考：广角到中焦；f/8–f/11 保证全景深；ISO 100；三脚架配渐变灰镜平衡天地大光比；对焦在超焦距附近。是把判断落到相机的起点，换了光线和场景就要重新试拍。","照搬构图却丢掉取舍：水平线放在画面中部偏下，山体与倒影上下呼应；前景岸石压住下缘，把二维的画面拉出纵深。的重点是让视线有去处，不是把每样东西都塞进画面。","忽略与同主题另两例的差别：和林间光柱比，这里光只负责「染色」，不动构图；和日落天空比，它有明确地标与前景倒影，不是纯色块。"],"example":"雪峰被初升的太阳照亮，受光面接近白、背光面沉进蓝灰，一条明暗分界线把山体的体积感直接画出来。湖面几乎没有波纹，把山完整复制了一遍，真实的峰与镜像的水在水平线处缝合，形成稳定而庄重的对称。岸边的石头作前景，让视线从近处一步步走到远山。色彩上暖橙的天与冷蓝的雪彼此制衡，既明亮又不刺眼。这张作品说明：大光比场景不必牺牲任何一方，用渐变灰镜与低 ISO 就能把天与地都收进动态范围。","case":{"scene":"高山湖畔，日出前后，雪山与湖面倒影同框，岸边有几块作前景的石头。","setup":"参考：广角到中焦；f/8–f/11 保证全景深；ISO 100；三脚架配渐变灰镜平衡天地大光比；对焦在超焦距附近。","why":"水平线放在画面中部偏下，山体与倒影上下呼应；前景岸石压住下缘，把二维的画面拉出纵深。 日出低角度侧光，雪面受光面与背光面明暗反差极大，天空从暖橙过渡到冷蓝。","note":"和林间光柱比，这里光只负责「染色」，不动构图；和日落天空比，它有明确地标与前景倒影，不是纯色块。"},"takeaway":"拍「马特洪峰日出倒影」这一类画面，先按「水平线放在画面中部偏下，山体与倒影上下呼应；前景岸石压住下缘，把二维……」定下取舍，再照「日出低角度侧光，雪面受光面与背光面明暗反差极大，天空从暖橙过……」调曝光；参数只是把判断落实的工具。","keywords":["风光","雪山","风光与光影","马特洪峰日出倒影"],"photo":{"alt":"马特洪峰日出，雪面与暗部反差极大","id":29734980,"page":"https://www.pexels.com/photo/sunrise-over-matterhorn-and-reflective-lake-29734980/","ph":"Ilia Bronskiy","src":"https://images.pexels.com/photos/29734980/pexels-photo-29734980.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/29734980/pexels-photo-29734980.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/29734980/pexels-photo-29734980.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Sunrise Over Matterhorn and Reflective Lake"}},{"id":"1-4-3","title":"1.4.3 日落冷暖天空","tag":"实操","section":"1.4 风光与光影","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"只有天空也能成片。这一例把注意力从「拍什么」转到「拍到的色温」，看固定白平衡后连续拍摄能读出什么。","principle":"拍摄场景：开阔地带或海边，日落前后，天空占据几乎全部画面。\n光线条件：太阳落山后的大气散射，暖色在低处、冷色在高处，色温随几分钟内的时刻持续变化。\n差异点：另两例都有清晰的地面主体（树林、雪山），这例几乎没有地面元素，纯靠色彩与色温过渡成立，练的是对白平衡和色块的判断。","steps":["主体：橘红与蓝色交界、层层过渡的云霞本身。","构图：极简处理，地平线压到画面下缘甚至隐去，让天空成为全部内容；云层走向与色块边界构成画面结构。","参考参数与器材：参考：中焦压缩色块；f/5.6–f/8；ISO 100；手动锁定白平衡便于比较不同时刻；点测光对准中间调天空。"],"mistakes":["把参考参数当成固定答案：参考：中焦压缩色块；f/5.6–f/8；ISO 100；手动锁定白平衡便于比较不同时刻；点测光对准中间调天空。是把判断落到相机的起点，换了光线和场景就要重新试拍。","照搬构图却丢掉取舍：极简处理，地平线压到画面下缘甚至隐去，让天空成为全部内容；云层走向与色块边界构成画面结构。的重点是让视线有去处，不是把每样东西都塞进画面。","忽略与同主题另两例的差别：另两例都有清晰的地面主体（树林、雪山），这例几乎没有地面元素，纯靠色彩与色温过渡成立，练的是对白平衡和色块的判断。"],"example":"天空被落日分成两个色区：低处是饱和的橘红，高处是沉静的蓝，中间由一层过渡的紫灰缝合。云被压成薄薄的片状，纹理不抢眼，颜色的渐变才是真正的主角。地平线几乎被省略，画面失去参照物，反而让人更敏感于色温的细微差别。这类照片的价值在于提醒初学者：风光不一定非要有山有水，把白平衡固定下来，连续拍同一片天，就能看清色温如何让同一场景呈现完全不同的情绪。","case":{"scene":"开阔地带或海边，日落前后，天空占据几乎全部画面。","setup":"参考：中焦压缩色块；f/5.6–f/8；ISO 100；手动锁定白平衡便于比较不同时刻；点测光对准中间调天空。","why":"极简处理，地平线压到画面下缘甚至隐去，让天空成为全部内容；云层走向与色块边界构成画面结构。 太阳落山后的大气散射，暖色在低处、冷色在高处，色温随几分钟内的时刻持续变化。","note":"另两例都有清晰的地面主体（树林、雪山），这例几乎没有地面元素，纯靠色彩与色温过渡成立，练的是对白平衡和色块的判断。"},"takeaway":"拍「日落冷暖天空」这一类画面，先按「极简处理，地平线压到画面下缘甚至隐去，让天空成为全部内容；云层走向与……」定下取舍，再照「太阳落山后的大气散射，暖色在低处、冷色在高处，色温随几分钟内……」调曝光；参数只是把判断落实的工具。","keywords":["风光","天色","风光与光影","日落冷暖天空"],"photo":{"alt":"日落时橘红与蓝色的天空各占一半","id":1048283,"page":"https://www.pexels.com/photo/orange-and-blue-skies-during-sunset-1048283/","ph":"Lisa from Pexels","src":"https://images.pexels.com/photos/1048283/pexels-photo-1048283.jpeg?auto=compress&cs=tinysrgb&w=1000","srcset":"https://images.pexels.com/photos/1048283/pexels-photo-1048283.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/1048283/pexels-photo-1048283.jpeg?auto=compress&cs=tinysrgb&w=1000 1000w","title":"Orange and Blue Skies during Sunset"}},{"id":"1-5-1","title":"1.5.1 百叶窗影下的人像","tag":"实操","section":"1.5 人像","chapterId":"ch1","chapterTitle":"第一章 摄影，从看见开始","lead":"同样是拍脸，加了窗影就有了戏剧性。这一例看直射光的硬边如何为肖像增加张力，又不破坏五官结构。","principle":"拍摄场景：室内白天，阳光透过百叶窗照进房间，人物坐在光影交界处。\n光线条件：侧前方直射阳光，被窗棂挡住的部分留下硬边条纹，没挡住的部分照亮颧骨与鼻梁，明暗界线几乎无过渡。\n差异点：与
