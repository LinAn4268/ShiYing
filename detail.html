改的动作。"],"example":"小赵有一组照片全在室内拍糊了，他没删，而是翻出参数发现快门只有 1/30 秒，远低于安全快门。他把规则写成室内手持不低于 1/125 秒，否则开大光圈或提 ISO。下次拍同样场景，照片张张清楚，废片就这样变成了经验。","takeaway":"给每张废片找到原因，进步才有方向。","keywords":["废片复盘","快门速度","曝光","归因"]},{"id":"10-4-3","title":"10.4.3 建立自己的场景—参数对照经验","tag":"提示","section":"10.4 拍完之后的简单复盘","chapterId":"ch10","chapterTitle":"第十章 拍摄前的准备与现场判断","lead":"长期记录和复盘后，你会形成一张什么场景用什么设置的经验表。它不是死规则，而是让你下次更快进入状态的起跑线。","principle":"把反复验证过的成功设置整理成对照表：室内窗边人像用 50mm f/2、ISO 400；傍晚风光用 f/8、ISO 100 加三脚架；夜景手持用 35mm f/1.8、快门 1/60 秒、ISO 1600。\n每项都来自你自己的实拍，比任何教程都更贴合你的器材和手感。\n遇到新场景时，先从表里找一个最接近的起点，再根据现场光线微调，比从零试错快得多。经验加复盘，是进步最快的方式，把别人的经验变成自己的，才算真正掌握。","steps":["按场景建表：室内人像、傍晚风光、夜景手持等。","每格填入验证过的光圈快门 ISO 和焦段。","标注适用条件，如有窗、下午三点侧光。","每次实拍后更新，把更好的设置替换进去。"],"mistakes":["照搬别人的参数，忽略自己器材的差异。","经验表一成不变，光线变了也不调。","只记成功案例，忘了记录失败教训。"],"example":"小孙把两年来的拍摄整理成一张对照表：阴天公园人像用 85mm f/2.8、ISO 200，傍晚海边用 f/11、1/30 秒加脚架。每次接到类似拍摄，他先看表定起点，再花两分钟试拍微调。这套自己的经验，比任何通用教程都顺手。","takeaway":"把经验变成一张表，下次直接站在起跑线上。","keywords":["场景参数表","复盘","经验积累","起跑线"]}];

  var order = all.map(function (d) { return d.id; });

      if (['paper', 'cinema', 'grid', 'ink', 'mono'].indexOf(t) === -1) return;
      theme = t; store.set('theme', theme); applyTheme();
    },
    setDark: function (v) { dark = !!v; store.set('dark', dark); applyTheme(); },
    getTheme: function () { return theme; }

  function buildToc() {
    var box = $('#dtToc');
    if (!all.length) { box.innerHTML = '<p class="dt-side-hint">内容加载失败，请从主页重新进入。</p>'; return; }

    var lastCh = '', lastSec = '';
    all.forEach(function (d) {
      if (d.chapterId !== lastCh) {
        if (lastCh) html += '</ul></div>';
        html += '<div class="dt-ch"><h3 class="dt-ch-title">' + esc(d.chapterId.replace('ch', '第') + '章 · ' + d.chapterTitle.replace(/^第[^章]*章\s*/, '')) + '</h3>';

  function tagHTML(tag) {

    var d = byId[id];

    $('#dtCrumb').innerHTML = '<b>' + esc(d.chapterTitle) + '</b> / ' + esc(d.section);

    var prev = idx > 0 ? byId[order[idx - 1]] : null;
    var next = idx < order.length - 1 ? byId[order[idx + 1]] : null;

    html += '<h1 class="dt-h1" id="dtTitle">' + esc(d.title) + '</h1>';

    html += prev

    html += next

    html += '</nav>';

    box.innerHTML = html;
    markCurrent(id);
    var activeLink = $('.dt-links a.is-current', $('#dtToc'));
    if (activeLink && activeLink.scrollIntoView) activeLink.scrollIntoView({ block: 'nearest' });
  }

  function markCurrent(id) {
    var side = $('#dtSide');
    var hit = null;
    $$('.dt-links a', side).forEach(function (a) {
      var on = a.getAttribute('data-id') === id;
      a.classList.toggle('is-current', on);

    if (hit && side.scrollHeight > side.clientHeight) {
      var top = hit.offsetTop - side.clientHeight / 2 + hit.offsetHeight / 2;
      side.scrollTop = Math.max(0, top);
    }
  }

  function currentId() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));

  }

  function openSide(on) {

  function closeTheme() {

  }

  function init() {
    if (!all.length) {

      var box = $('#dtArticle');
      box.innerHTML = '<div class="dt-notfound"><h1>详情内容暂不可用</h1><p>请先在项目目录运行构建脚本，再打开本页。</p><a class="btn btn-primary" href="index.html">返回拾影主页</a></div>';
    } else {
      buildToc();
      render(currentId());
    }
    applyTheme();

    window.addEventListener('hashchange', function () {
      var h = decodeURIComponent(location.hash.replace(/^#/, ''));
      render(byId[h] ? h : '');
      window.scrollTo({ top: 0, behavior: 'auto' });
      openSide(false);
    });

    $('#dtBack').addEventListener('click', function () { location.href = 'index.html'; });
    $('#dtSideToggle').addEventListener('click', function () { openSide(!$('#dtSide').classList.contains('open')); });
    $('#dtMask').addEventListener('click', function () { openSide(false); });

    $('#dtThemeBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      var m = $('#dtThemeMenu');
      var willOpen = m.hidden;
      m.hidden = !willOpen;
      $('#dtThemeBtn').setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      if (willOpen) { var cur = $('[data-theme-choice="' + theme + '"]'); if (cur) cur.focus(); }
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.theme-wrap')) closeTheme();
    });
    $$('[data-theme-choice]').forEach(function (b) {
      b.addEventListener('click', function () {
        theme = b.getAttribute('data-theme-choice');
        store.set('theme', theme);
        applyTheme();
        closeTheme();
        $('#dtThemeBtn').focus();
      });
    });
    $('#dtDarkBtn').addEventListener('click', function () {
      dark = !dark; store.set('dark', dark); applyTheme();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeTheme(); openSide(false); }
    });

    var toTop = $('#dtToTop');
    var ticking = false;
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        toTop.classList.toggle('show', window.scrollY > 500);
        ticking = false;
      });
    }, { passive: true });
    toTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  ];

  var SIZES = [{ id: 's', name: '小' }, { id: 'm', name: '标准' }, { id: 'l', name: '大' }, { id: 'xl', name: '特大' }];
  var LEADS = [{ id: 'tight', name: '紧凑' }, { id: '', name: '标准' }, { id: 'loose', name: '宽松' }];
  var DENS = [{ id: '', name: '宽松' }, { id: 'compact', name: '紧凑' }];

  /* ----------------------------- 颜色工具 ----------------------------- */

      '<div class="look-foot"><button type="button" class="look-reset" data-look-reset>恢复默认外观</button></div>' +
    '</aside>' +
    '<p class="sr-only" id="lookLive" aria-live="polite"></p>';

  var panel = document.getElementById('lookPanel');
  var live = document.getElementById('lookLive');
  var openBtn = document.getElementById('lookBtn');
  var lastFocus = null;

  function say(msg) { if (live) live.textContent = msg; }

  function openPanel() {
    lastFocus = document.activeElement;
    document.body.classList.add('look-open');
    panel.setAttribute('aria-hidden', 'false');
    if (openBtn) openBtn.setAttribute('aria-expanded', 'true');
    if (panel.focus) panel.focus();
  }
  function closePanel(restore) {
    document.body.classList.remove('look-open');
    panel.setAttribute('aria-hidden', 'true');
    if (openBtn) openBtn.setAttribute('aria-expanded', 'false');
    if (restore !== false) {
      if (lastFocus && lastFocus !== document.body && lastFocus.focus) lastFocus.focus();
      else if (openBtn) openBtn.focus();
    }
  }

  function syncTheme(cur) {
    Array.prototype.forEach.call(panel.querySelectorAll('[data-look-theme]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-look-theme') === cur ? 'true' : 'false');
    });
  }

  function setChoice(group, value) {
    state[group] = value;
    put(K[group], value);
    if (group === 'accent') applyAccent(); else apply();
    Array.prototype.forEach.call(panel.querySelectorAll('[data-look-group="' + group + '"]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-look-value') === value ? 'true' : 'false');
    });
  }

  panel.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest('[data-look-close]')) { closePanel(); return; }
    if (t.closest('[data-look-reset]')) {
      state = { font: '', size: '', lead: '', density: '', accent: '' };
      Object.keys(K).forEach(function (g) { put(K[g], ''); });
      apply();
      Array.prototype.forEach.call(panel.querySelectorAll('[data-look-group]'), function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-look-value') === '' ? 'true' : 'false');
      });
      say('已恢复默认外观');
      return;
    }
    var chip = t.closest('[data-look-group]');
    if (chip) {
      var g = chip.getAttribute('data-look-group');
      setChoice(g, chip.getAttribute('data-look-value'));
      say(chip.textContent.trim() + ' 已应用');
      return;
    }
    var card = t.closest('[data-look-theme]');
    if (card) {
      var id = card.getAttribute('data-look-theme');
      if (window.SY && window.SY.setTheme) window.SY.setTheme(id);
      else { root.setAttribute('data-theme', id); put('theme', id); }
      syncTheme(id);
      applyAccent();
      say(card.querySelector('.nm').textContent + ' 已应用');
    }
  });

  if (openBtn) {
    openBtn.addEventListener('click', function () {
      if (document.body.classList.contains('look-open')) closePanel(); else openPanel();
    });
  }

  document.addEventListener('keydown', function (e) {
    if (!document.body.classList.contains('look-open')) return;
    if (e.key === 'Escape') { e.preventDefault(); closePanel(); return; }
    if (e.key === 'Tab') {
      var f = panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* 模板/暗色由别处改动时，重算强调色并同步面板 */
  if (window.MutationObserver) {
    new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        if (muts[i].attributeName === 'data-theme') syncTheme(root.getAttribute('data-theme'));
        if (muts[i].attributeName === 'data-theme' || muts[i].attributeName === 'data-dark') applyAccent();
      }
    }).observe(root, { attributes: true, attributeFilter: ['data-theme', 'data-dark'] });
  }

  apply();

  window.SYLook = { open: openPanel, close: closePanel, state: state };
})();

</script>
</body>
</html>
